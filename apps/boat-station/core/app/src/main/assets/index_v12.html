16px 28px;height:86vh;overflow-y:auto;transition:transform .18s ease}.handle{width:44px;height:5px;background:#315064;border-radius:99px;margin:0 auto 16px}.option{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line)}.btn{border:1px solid #24516a;background:#102f45;color:#fff;border-radius:10px;padding:9px 11px}.field,.select{background:#071827;color:#fff;border:1px solid #24516a;border-radius:9px;padding:9px}.field{width:150px}.danger{color:var(--bad)}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#102e43;border:1px solid #1c536d;padding:10px 13px;border-radius:10px;opacity:0;z-index:400;transition:opacity .15s}.toast.show{opacity:1}.scan-item{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.backrow{display:flex;align-items:center;gap:8px;margin-bottom:12px}.compass-wrap{height:166px;display:flex;align-items:center;justify-content:center;position:relative}.rose{width:154px;height:154px;border-radius:50%;border:2px solid #285067;position:relative;background:radial-gradient(circle,#0c2638 0,#081b29 70%)}.rose:before,.rose:after{content:"";position:absolute;left:50%;top:8px;bottom:8px;width:1px;background:#24475c;transform:translateX(-50%)}.rose:after{top:50%;left:8px;right:8px;width:auto;height:1px;transform:none}.cardinal{position:absolute;font-size:12px;font-weight:800;color:#c7d7df}.n{top:5px;left:50%;transform:translateX(-50%);color:var(--accent)}.s{bottom:5px;left:50%;transform:translateX(-50%)}.e{right:7px;top:50%;transform:translateY(-50%)}.w{left:7px;top:50%;transform:translateY(-50%)}.needle{position:absolute;left:50%;top:50%;width:4px;height:62px;background:linear-gradient(to top,#355064 48%,var(--accent) 49%);transform-origin:50% 100%;border-radius:3px;transition:transform .12s linear}.hub{position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:50%;background:#d7eef2;transform:translate(- :{name:'Baterías'},compass:{name:'Brújula'}};function $(q){return document.querySelector(q)}function vals(o){var a=[],k;for(k in o)if(Object.prototype.hasOwnProperty.call(o,k))a.push(o[k]);return a}function readJson(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}var oldOrder=readJson('bs.order',['gps','phone','seastate','batteries','compass']),order=[],oi;for(oi=0;oi<oldOrder.length;oi++)if(catalog[oldOrder[oi]])order.push(oldOrder[oi]);if(order.indexOf('compass')<0)order.push('compass');var collapsed=readJson('bs.collapsed',{}),views=readJson('bs.views',{}),seaFactor=Number(localStorage.getItem('bs.seaFactor')||1),compassMode=localStorage.getItem('bs.compassMode')||'normal';var state={gps:null,phone:null,headingTarget:0,headingSmooth:0,motion:0,seaAvg:0,seaPeak:0,wave:0,banks:{},batteries:{}};var motionSamples=[],lastSea=0,scanResults={},currentConfig=null,currentBatteryId=null,suppressClickUntil=0,cards=$('#cards');function save(){localStorage.setItem('bs.order',JSON.stringify(order));localStorage.setItem('bs.collapsed',JSON.stringify(collapsed));localStorage.setItem('bs.views',JSON.stringify(views));localStorage.setItem('bs.seaFactor',String(seaFactor));localStorage.setItem('bs.compassMode',compassMode)}function toast(t){var e=$('#toast');if(!e)return;e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('show')},1600)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]})}function set(q,v){var e=$(q);if(e)e.textContent=v}function fmt(v){return Number(v).toFixed(6)+'°'}function dots(n,i){var h='<div class="pager">',x;for(x=0;x<n;x++)h+='<span class="'+(x===i?'on':'')+'">'+(x===i?'●':'○')+'</span> ';return h+'</div>'}function batteriesForBank(id){var all=vals(state.batteries),out=[],i;for(i=0;i<all.length;i++)if(Number(all[i].bankId)===Number(id))out.push(all[i]);return out}functi </div><div class="metric"><div class="value" data-pcharge>—</div><div class="label">Estado</div></div><div class="metric"><div class="value" data-net>—</div><div class="label">Red</div></div></div></div>';if(id==='seastate')return '<div class="view"><div class="metric-grid three"><div class="metric"><div class="value" data-wave>0.00 m</div><div class="label">Ola estimada</div></div><div class="metric"><div class="value" data-mavg>0.00</div><div class="label">Mov. medio</div></div><div class="metric"><div class="value" data-mpeak>0.00</div><div class="label">Pico</div></div></div><div class="sub" style="margin-top:9px">Promedio móvil de 30 s</div></div>';if(id==='batteries')return '<div class="view"><div id="banksView"></div>'+dots(2,i)+'</div><div class="view"><div id="batteryListView"></div>'+dots(2,i)+'</div>';if(id==='compass')return '<div class="view"><div class="compass-wrap"><div class="rose"><span class="cardinal n">N</span><span class="cardinal e">E</span><span class="cardinal s">S</span><span class="cardinal w">O</span><div class="needle" id="needle"></div><div class="hub"></div></div><div class="compass-value" data-heading>—°</div></div><div class="sub">Rumbo magnético · '+esc(compassMode)+'</div></div>';return ''}function card(id){return '<section class="card '+(collapsed[id]?'collapsed':'')+'" data-id="'+id+'"><div class="card-head"><span class="drag">⋮⋮</span><span class="dot"></span><div class="title-toggle"><span>▾</span><span class="title">'+catalog[id].name+'</span></div><span class="summary">'+(id==='batteries'?esc(batterySummary()):'Activo')+'</span><button class="more">⋯</button></div><div class="card-body">'+body(id)+'</div></section>'}function render(){var h='',i,cs;for(i=0;i<order.length;i++)h+=card(order[i]);cards.innerHTML=h;cs=cards.querySelectorAll('.card');for(i=0;i<cs.length;i++)setView(cs[i]);bindCards();applyLive();renderSensors()}function setView(c){var vs=c.querySelectorAll('.view'),i=Math.min(views[c.getAttribute('data-id')]||0,Math.max(0,vs.length-1)),x,y,ps,ch;for(x=0;x<vs.length;x++)vs[x].classList.toggle('active',x===i);ps=c.querySelectorAll('.pager');for(x=0;x<ps.length;x++){ch=ps[x].children;for(y=0;y<ch.length;y++){ch[y].classList.toggle('on',y===i);ch[y].textContent=y===i?'●':'○'}}}function cycleView(c,dir){var vs=c.querySelectorAll('.view');if(vs.length<2||c.getAttribute('data-flipping')==='1')return;var id=c.getAttribute('data-id'),cur=views[id]||0,next=(cur+dir+vs.length)%vs.length,out=dir>0?'flip-out-left':'flip-out-right',inn=dir>0?'flip-in-right':'flip-in-left';c.setAttribute('data-flipping','1');c.classList.add(out);setTimeout(function(){views[id]=next;save();setView(c);c.classList.remove(out);c.classList.add(inn);setTimeout(function(){c.classList.remove(inn);c.setAttribute('data-flipping','0');applyLive()},205)},155)}function bindCards(){var ts=cards.querySelectorAll('.title-toggle'),ms=cards.querySelectorAll('.more'),cs=cards.querySelectorAll('.card'),i;for(i=0;i<ts.length;i++)ts[i].onclick=function(){if(Date.now()<suppressClickUntil)return;var c=this.closest('.card'),id=c.getAttribute('data-id');c.classList.toggle('collapsed');collapsed[id]=c.classList.contains('collapsed');save();applyLive()};for(i=0;i<ms.length;i++)ms[i].onclick=function(e){e.stopPropagation();if(Date.now()<suppressClickUntil)return;openConfig(this.closest('.card').getAttribute('data-id'))};for(i=0;i<cs.length;i++)(function(c){var sx=0,sy=0;c.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});c.addEventListener('touchend',function(e){if(!e.changedTouches.length)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy)*1.2){suppressClickUntil=Date.now()+350;cycleView(c,dx<0?1:-1)}},{passive:true})})(cs[i])}function renderBanks(){var e=$('#banksView');if(!e)return;var list=vals(state.banks),h='',i,b,s;if(!list.length){e.innerHTML='<div class="sub">No hay ban
