plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boatstation.app'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.boatstation.app'
        minSdk 26
        targetSdk 35
        versionCode 10204
        versionName '1.2.4'
    }

    signingConfigs {
        release {
            def ks = System.getenv('BOAT_STATION_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('BOAT_STATION_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BOAT_STATION_KEY_ALIAS') ?: 'boatstation'
                keyPassword System.getenv('BOAT_STATION_KEY_PASSWORD') ?: System.getenv('BOAT_STATION_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
