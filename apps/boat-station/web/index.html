<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Boat Station</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./battery-overview.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <button id="menuBtn" class="iconbtn">☰</button>
    <div class="brand">BOAT <b>STATION</b></div>
    <button id="addBtn" class="iconbtn">＋</button>
  </div>
  <main id="cards" class="content"></main>
</div>
<div id="menuSheet" class="sheet"><div class="sheet-inner"><div class="handle"></div><h3>Boat Station</h3></div></div>
<div id="addSheet" class="sheet"><div class="sheet-inner"><div class="handle"></div><h3>Agregar módulo</h3><div class="option" data-add-module="gps" role="button">GPS <span data-add-state></span></div><div class="option" data-add-module="phone" role="button">Estado del teléfono <span data-add-state></span></div><div class="option" data-add-module="seastate" role="button">Sea State <span data-add-state></span></div><div class="option" data-add-module="compass" role="button">Brújula <span data-add-state></span></div></div></div>
<script src="./remote_landing.js"></script>
<script>
(async function(){
  const params=new URLSearchParams(location.search);
  const isLocal=params.get('mode')==='station'||!!window.CoreBridge||!!window.BoatStationCore||!!window.NativeBridge;

  // Remote web must never boot the local sensor/module runtime. It only renders
  // the snapshot received from the selected Boat Station.
  if(isLocal){
    await import('./app.js');
    await import('./native-bluetooth.js');
  }else{
    document.getElementById('cards').innerHTML='';
    document.getElementById('addBtn').style.display='none';
  }

  await import('./stations.js');
  await import('./stations-menu-style.js');

  if(!isLocal)return;
  const all=['gps','phone','seastate','compass'];
  const sheet=document.getElementById('addSheet');
  function order(){try{const v=JSON.parse(localStorage.getItem('bs.clean.order')||'null');return Array.isArray(v)?v.filter(id=>all.includes(id)):all.slice()}catch(_){return all.slice()}}
  function refresh(){const active=order();sheet.querySelectorAll('[data-add-module]').forEach(row=>{const id=row.dataset.addModule,on=active.includes(id),state=row.querySelector('[data-add-state]');row.dataset.active=on?'1':'0';row.style.opacity=on?'.5':'1';if(state)state.textContent=on?' · agregado':' · agregar'})}
  document.getElementById('addBtn').addEventListener('click',refresh);
  sheet.addEventListener('click',e=>{const row=e.target.closest('[data-add-module]');if(!row)return;const id=row.dataset.addModule,current=order();if(current.includes(id))return;current.push(id);localStorage.setItem('bs.clean.order',JSON.stringify(current));location.reload()});
  refresh();
})().catch(err=>{
  console.error('Boat Station bootstrap error',err);
  if(!document.getElementById('remoteLanding')){
    const box=document.createElement('div');box.style.cssText='padding:24px;color:#fff;font-family:system-ui';box.textContent='No se pudo iniciar Boat Station. Recargá la página.';document.body.appendChild(box);
  }
});
</script>
</body>
</html>
