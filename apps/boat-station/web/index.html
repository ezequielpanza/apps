<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Boat Station Remote</title>
<meta name="theme-color" content="#061522">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.png">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./battery-overview.css">
<link rel="stylesheet" href="./stations.css">
<link rel="stylesheet" href="./remote-client-ui.css">
<link rel="stylesheet" href="./page-interactions.css">
<link rel="stylesheet" href="./adaptive-pages.css">
<script>
(function(){
  if(window.__bsNativeQueue)return;
  window.__bsNativeQueue=[];
  const methods=['updateGPS','updatePhone','updateCompass','updateMotion','onBleScanResult','onBatteryConnection','onBatteryData'];
  const stub={};
  methods.forEach(name=>stub[name]=value=>window.__bsNativeQueue.push([name,value]));
  window.BoatStation=stub;
})();
</script>
</head>
<body>
<div class="app"><div class="topbar"><button id="menuBtn" class="iconbtn">☰</button><div class="brand">BOAT <b>STATION</b></div><button id="addBtn" class="iconbtn">＋</button></div><main id="cards" class="content"></main></div>
<div id="menuSheet" class="sheet"><div class="sheet-inner"><div class="handle"></div><h3>Boat Station</h3></div></div>
<div id="addSheet" class="sheet"><div class="sheet-inner"><div class="handle"></div><h3>Agregar módulo</h3></div></div>
<script src="./remote_landing.js"></script>
<script src="./native-tools-adapter.js"></script>
<script>
(async function(){
  const params=new URLSearchParams(location.search);
  const isLocal=params.get('mode')==='station'||!!window.CoreBridge||!!window.BoatStationCore||!!window.NativeBridge;
  if(isLocal) document.title='Boat Station';
  const menu=document.getElementById('menuSheet');

  try{
    await import('./app.js');
  }catch(err){
    console.error('Boat Station UI failed to start',err);
    return;
  }

  try{
    await import('./page-interactions.js');
  }catch(err){
    console.warn('Boat Station page interactions unavailable',err);
  }

  try{
    await import('./battery-flow-status.js');
  }catch(err){
    console.warn('Boat Station battery flow status unavailable',err);
  }

  try{
    await import('./battery-manager-status.js');
  }catch(err){
    console.warn('Boat Station battery manager status unavailable',err);
  }

  try{
    await import('./battery-chart-labels.js');
  }catch(err){
    console.warn('Boat Station battery chart labels unavailable',err);
  }

  try{
    await import('./data-sync.js');
  }catch(err){
    console.warn('Boat Station data sync unavailable',err);
  }

  try{
    await import('./pwa-version.js');
  }catch(err){
    console.warn('Boat Station PWA version bridge unavailable',err);
  }

  try{
    await import('./stations.js');
  }catch(err){
    console.error('Boat Station station management unavailable',err);
  }

  if(isLocal){
    try{
      await import('./native-bluetooth.js');
    }catch(err){
      console.warn('Boat Station Bluetooth adapter unavailable',err);
    }
    const queued=window.__bsNativeQueue||[];
    window.__bsNativeQueue=[];
    queued.forEach(([name,value])=>{try{window.BoatStation?.[name]?.(value)}catch(err){console.error('Boat Station native event error',name,err)}});
  }else{
    document.documentElement.classList.add('bs-remote-client');
    document.getElementById('addBtn').style.display='none';
    const inner=menu.querySelector('.sheet-inner');
    if(inner){
      const row=document.createElement('div');
      row.className='option remote-apk-row';
      row.innerHTML='<span>Boat Station APK<br><small class="sub">Última versión disponible</small></span><a class="btn" href="/BoatStation.apk" download>Descargar</a>';
      inner.appendChild(row);
      try{
        const versionResponse=await fetch('/APK_VERSION?v='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
        if(versionResponse.ok){
          const version=(await versionResponse.text()).trim();
          if(version){
            const download=row.querySelector('.btn');
            download.textContent='Descargar '+version;
            download.href='/BoatStation-'+version+'.apk';
            download.setAttribute('download','BoatStation-'+version+'.apk');
          }
        }
      }catch(err){
        console.warn('Boat Station APK version unavailable',err);
      }
    }
    try{
      await import('./remote-client-ui-v2.js');
    }catch(err){
      console.warn('Boat Station Remote UI extras unavailable',err);
    }
  }

  if('serviceWorker' in navigator&&location.protocol==='https:'){
    navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Boat Station SW',err));
  }
})().catch(err=>console.error('Boat Station bootstrap error',err));
</script>
</body>
</html>
