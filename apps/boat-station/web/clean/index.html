<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Boat Station Clean</title><style>:root{--bg:#061522;--card:#0b2335;--card2:#0e2b40;--text:#f4f8fb;--muted:#94a7b6;--line:#17394f;--accent:#1ed7e5}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{overflow-y:auto}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#061522f2;border-bottom:1px solid #103248}.brand{font-weight:850;letter-spacing:.05em}.brand b{color:var(--accent)}.iconbtn{width:42px;height:42px;border:1px solid #24516a;border-radius:12px;background:#0b2639;color:#fff;font-size:22px}.content{padding:12px 12px 90px}.card{position:relative;background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:17px;margin-bottom:11px;overflow:hidden}.card-head{height:50px;display:flex;align-items:center;gap:8px;padding:9px 11px;touch-action:pan-y}.dot{width:9px;height:9px;border-radius:50%;background:#8bd332}.title{font-weight:780;flex:1}.summary{font-size:12px;color:var(--muted)}.more{border:0;background:transparent;color:#fff;font-size:21px;padding:8px}.card-body{height:150px;padding:10px 12px 14px;overflow:hidden;touch-action:pan-y}.card.collapsed .card-body{display:none}.page{display:none;height:100%}.page.active{display:block}.pager{text-align:center;color:#617b8d;font-size:12px;letter-spacing:3px;margin-top:10px}.pager .on{color:var(--accent)}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#113148;border:1px solid #173d55;border-radius:11px;padding:10px}.metric .value{font-size:21px;font-weight:800}.metric .label{font-size:11px;color:var(--muted);margin-top:5px}.sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:50}.sheet.open{display:flex}.sheet-inner{width:100%;height:62vh;background:#0b2335;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:17px 16px 28px}.handle{width:44px;height:5px;background:#315064;border-radius:99px;margin:0 auto 16px}.option{padding:14px 2px;border-bottom:1px solid var(--line)}.test-note{font-size:12px;color:var(--muted);padding:10px 12px 0}input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text}</style></head><body><div class="app"><div class="topbar"><button id="menuBtn" class="iconbtn">☰</button><div class="brand">BOAT <b>STATION</b></div><button id="addBtn" class="iconbtn">＋</button></div><div class="test-note">PWA limpia · prueba de interacción</div><main id="cards" class="content"></main></div><div id="menuSheet" class="sheet"><div class="sheet-inner"><div class="handle"></div><h3>Boat Station</h3><div class="option">Menú operativo</div><div class="option">Sin bridges nativos</div></div></div><div id="addSheet" class="sheet"><div class="sheet-inner"><div class="handle"></div><h3>Agregar módulo</h3><div class="option">Prueba: este panel responde al tap</div></div></div><script>(()=>{const defs=[['gps','GPS'],['phone','Estado del teléfono'],['seastate','Sea State'],['compass','Brújula']];const state={order:defs.map(x=>x[0]),collapsed:{},page:{}};const cards=document.getElementById('cards');function html(id,name){const p=state.page[id]||0;return `<section class="card${state.collapsed[id]?' collapsed':''}" data-id="${id}"><header class="card-head"><span class="dot"></span><span class="title">${name}</span><span class="summary">demo</span><button class="more" data-more="${id}">⋮</button></header><div class="card-body" style="height:${id==='compass'?200:150}px"><div class="page ${p===0?'active':''}"><div class="metric-grid"><div class="metric"><div class="value">123</div><div class="label">Dato A</div></div><div class="metric"><div class="value">456</div><div class="label">Dato B</div></div></div><div class="pager"><span class="${p===0?'on':''}">●</span> <span class="${p===1?'on':''}">○</span></div></div><div class="page ${p===1?'active':''}"><div class="metric"><div class="value">Página 2</div><div class="label">Swipe horizontal</div></div><div class="pager"><span>○</span> <span class="on">●</span></div></div></div></section>`}function render(){cards.innerHTML=state.order.map(id=>html(id,defs.find(x=>x[0]===id)[1])).join('')}render();const menu=document.getElementById('menuSheet'),add=document.getElementById('addSheet');document.getElementById('menuBtn').onclick=()=>menu.classList.add('open');document.getElementById('addBtn').onclick=()=>add.classList.add('open');[menu,add].forEach(s=>s.addEventListener('click',e=>{if(e.target===s)s.classList.remove('open')}));let gesture=null;cards.addEventListener('pointerdown',e=>{const card=e.target.closest('.card');if(!card)return;if(e.target.closest('.more'))return;gesture={id:card.dataset.id,x:e.clientX,y:e.clientY,time:Date.now()}});cards.addEventListener('pointerup',e=>{if(!gesture)return;const g=gesture;gesture=null;const dx=e.clientX-g.x,dy=e.clientY-g.y;if(Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy)*1.2){state.page[g.id]=((state.page[g.id]||0)+1)%2;render();return}if(Math.abs(dx)<8&&Math.abs(dy)<8&&Date.now()-g.time<350){state.collapsed[g.id]=!state.collapsed[g.id];render()}});cards.addEventListener('pointercancel',()=>{gesture=null});cards.addEventListener('click',e=>{const more=e.target.closest('.more');if(more){e.stopPropagation();alert('Configurar '+more.closest('.card').querySelector('.title').textContent)}})})();</script></body></html>
