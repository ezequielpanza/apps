<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Boat Station UI Test</title><style>html,body{margin:0;background:#061522;color:#f4f8fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100%;touch-action:manipulation}main{padding:24px}.card{background:#0b2335;border:1px solid #17394f;border-radius:18px;padding:18px;margin:14px 0}.btn{width:100%;min-height:58px;border-radius:14px;border:1px solid #25d6e6;background:#10344a;color:#fff;font-size:18px;font-weight:750;margin:8px 0}.box{height:160px;border-radius:14px;background:#0d2c42;display:flex;align-items:center;justify-content:center;font-size:18px;user-select:none;touch-action:pan-y}.status{font:14px monospace;line-height:1.7;color:#bff8ff;white-space:pre-wrap}.ok{color:#9ee56d}</style></head><body><main><h2>Boat Station · prueba de interfaz</h2><div class="card"><button id="tap" class="btn">Probar tap</button><button id="hold" class="btn">Mantener presionado</button><div id="swipe" class="box">Deslizá horizontalmente acá</div></div><div class="card status" id="status">Inicializando…</div></main><script>(function(){var s=document.getElementById('status'),tap=0,hold=0,swipe=0,lastEvent='';function show(){s.textContent='JavaScript: OK\nTap: '+tap+'\nTap & hold: '+hold+'\nSwipe: '+swipe+'\nÚltimo evento: '+lastEvent+'\nHora: '+new Date().toLocaleTimeString()}show();setInterval(show,500);document.getElementById('tap').addEventListener('click',function(){tap++;lastEvent='click';show()});var hb=document.getElementById('hold'),ht=null,moved=false;hb.addEventListener('pointerdown',function(){moved=false;lastEvent='pointerdown';clearTimeout(ht);ht=setTimeout(function(){if(!moved){hold++;lastEvent='hold';show()}},650)});hb.addEventListener('pointermove',function(){moved=true});['pointerup','pointercancel','pointerleave'].forEach(function(n){hb.addEventListener(n,function(){clearTimeout(ht)})});var b=document.getElementById('swipe'),sx=0,sy=0,down=false;b.addEventListener('pointerdown',function(e){down=true;sx=e.clientX;sy=e.clientY;lastEvent='swipe down'});b.addEventListener('pointerup',function(e){if(!down)return;down=false;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){swipe++;lastEvent=dx>0?'swipe right':'swipe left'}else lastEvent='swipe too short';show()});window.addEventListener('error',function(e){lastEvent='ERROR: '+e.message;show()})})();</script></body></html>
