openapi: 3.1.0
info:
  title: Chez YouTube Tool
  version: 1.0.0
  description: >-
    Permite a ChatGPT leer comentarios pendientes del canal Chez Team,
    consultar el perfil de estilo y guardar propuestas de respuesta.
servers:
  - url: https://chez-youtube-tool.ezequielpanza.workers.dev
security:
  - bearerAuth: []
paths:
  /api/gpt/pending-comments:
    get:
      operationId: listPendingYouTubeComments
      summary: Listar comentarios pendientes
      description: Devuelve los comentarios principales pendientes de revisión junto con el video y cualquier propuesta existente.
      responses:
        '200':
          description: Comentarios pendientes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Credencial inválida
        '409':
          description: YouTube todavía no está conectado
  /api/gpt/style-profile:
    get:
      operationId: getChezTeamReplyStyle
      summary: Consultar el perfil de estilo
      description: Devuelve reglas, métricas y ejemplos aprendidos de respuestas aprobadas o editadas.
      responses:
        '200':
          description: Perfil de estilo de Chez Team
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Credencial inválida
  /api/gpt/proposals/batch:
    post:
      operationId: createYouTubeReplyProposals
      summary: Guardar propuestas de respuesta
      description: >-
        Guarda una o varias propuestas preparadas por ChatGPT. Esta operación no publica
        respuestas en YouTube; la publicación requiere revisión y aprobación explícita.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [comment_id, proposed_text]
                    properties:
                      comment_id:
                        oneOf:
                          - type: integer
                          - type: string
                      proposed_text:
                        type: string
                        minLength: 1
                      model_label:
                        type: string
                      confidence:
                        type: number
                        minimum: 0
                        maximum: 1
                      rationale:
                        type: string
                      knowledge_used:
                        type: array
                        items:
                          type: string
      responses:
        '200':
          description: Propuestas guardadas
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Solicitud inválida
        '401':
          description: Credencial inválida
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: shared-secret
