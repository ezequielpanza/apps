openapi: 3.0.1
info:
  title: Chez YouTube Tool
  version: 1.0.1
  description: Permite a ChatGPT leer comentarios pendientes del canal Chez Team, consultar el perfil de estilo y guardar propuestas de respuesta para revisión.
servers:
  - url: https://chez-youtube-tool.ezequielpanza.workers.dev
security:
  - bearerAuth: []
paths:
  /api/gpt/pending-comments:
    get:
      operationId: listPendingYouTubeComments
      summary: Listar comentarios pendientes
      description: Devuelve comentarios principales pendientes junto con el video y las propuestas existentes.
      responses:
        '200':
          description: Comentarios pendientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingCommentsResponse'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: YouTube todavía no está conectado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/gpt/style-profile:
    get:
      operationId: getChezTeamReplyStyle
      summary: Consultar el perfil de estilo
      description: Devuelve reglas, métricas y ejemplos aprendidos de respuestas aprobadas o editadas.
      responses:
        '200':
          description: Perfil de estilo de Chez Team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleProfileResponse'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/gpt/proposals/batch:
    post:
      operationId: createYouTubeReplyProposals
      summary: Guardar propuestas de respuesta
      description: Guarda propuestas preparadas por ChatGPT. No publica respuestas en YouTube; la publicación requiere revisión y aprobación explícita.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalBatchRequest'
      responses:
        '200':
          description: Propuestas guardadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalBatchResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credencial inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    PendingComment:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        youtube_comment_id:
          type: string
        video_id:
          type: string
        video_title:
          type: string
        author_name:
          type: string
        text_original:
          type: string
        published_at:
          type: string
        status:
          type: string
        proposal_id:
          nullable: true
          oneOf:
            - type: integer
            - type: string
        proposed_text:
          type: string
          nullable: true
        proposal_status:
          type: string
          nullable: true
      additionalProperties: true
    PendingCommentsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PendingComment'
      required:
        - items
      additionalProperties: true
    StyleProfileResponse:
      type: object
      properties:
        metrics:
          type: object
          additionalProperties: true
        rules:
          type: array
          items:
            type: object
            additionalProperties: true
        examples:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
        - metrics
        - rules
        - examples
      additionalProperties: true
    ProposalItem:
      type: object
      required:
        - comment_id
        - proposed_text
      properties:
        comment_id:
          oneOf:
            - type: integer
            - type: string
        proposed_text:
          type: string
          minLength: 1
        model_label:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        rationale:
          type: string
        knowledge_used:
          type: array
          items:
            type: string
      additionalProperties: false
    ProposalBatchRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/ProposalItem'
      additionalProperties: false
    ProposalResult:
      type: object
      properties:
        comment_id:
          oneOf:
            - type: integer
            - type: string
        proposal_id:
          oneOf:
            - type: integer
            - type: string
        status:
          type: string
      additionalProperties: true
    ProposalBatchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProposalResult'
        created:
          type: integer
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      additionalProperties: true
