<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Chez Nutrition</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Chez Team</div>
        <h1>Nutrición diaria</h1>
        <p id="todayLabel" class="muted"></p>
      </div>
      <div class="actions">
        <button id="refreshBtn" class="btn secondary">Actualizar</button>
        <button id="settingsBtn" class="btn">Configurar</button>
      </div>
    </header>

    <section id="authPanel" class="panel auth-panel">
      <div>
        <h2>Conectar Google Sheets</h2>
        <p class="muted">La planilla sigue privada. La app pide acceso de solo lectura a Google Sheets.</p>
      </div>
      <button id="connectBtn" class="btn primary">Conectar Google</button>
    </section>

    <section id="statusBar" class="status hidden"></section>

    <section id="peopleGrid" class="people-grid"></section>

    <section class="charts-grid">
      <article class="panel chart-card">
        <div class="section-head">
          <div>
            <div class="eyebrow">Evolución</div>
            <h2>Peso</h2>
          </div>
        </div>
        <canvas id="weightChart"></canvas>
      </article>
      <article class="panel chart-card">
        <div class="section-head">
          <div>
            <div class="eyebrow">Evolución</div>
            <h2>Calorías por día</h2>
          </div>
        </div>
        <canvas id="calorieChart"></canvas>
      </article>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <div class="eyebrow">Hoy</div>
          <h2>Ingestas</h2>
        </div>
      </div>
      <div id="intakes" class="intakes"></div>
    </section>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" class="settings-form" id="settingsForm">
      <div class="section-head">
        <div>
          <div class="eyebrow">Configuración</div>
          <h2>Conexión y objetivos</h2>
        </div>
        <button class="icon-btn" value="cancel" aria-label="Cerrar">×</button>
      </div>

      <label>Google OAuth Client ID
        <input id="clientIdInput" placeholder="xxxxxxxx.apps.googleusercontent.com" />
      </label>
      <label>Spreadsheet ID
        <input id="spreadsheetInput" value="1D1bh6oqja9iuET3O-zvkcuHSW54cBcq9Q7ihZ3KHmRw" />
      </label>

      <div class="goal-grid">
        <fieldset>
          <legend>Eze</legend>
          <label>kcal <input id="ezeKcal" type="number" value="1800" /></label>
          <label>P (g) <input id="ezeP" type="number" value="115" /></label>
          <label>H (g) <input id="ezeH" type="number" value="200" /></label>
          <label>G (g) <input id="ezeG" type="number" value="60" /></label>
        </fieldset>
        <fieldset>
          <legend>Chilu</legend>
          <label>kcal <input id="chiluKcal" type="number" value="1425" /></label>
          <label>P (g) <input id="chiluP" type="number" value="70" /></label>
          <label>H (g) <input id="chiluH" type="number" value="162" /></label>
          <label>G (g) <input id="chiluG" type="number" value="55" /></label>
        </fieldset>
      </div>

      <div class="dialog-actions">
        <button value="cancel" class="btn secondary">Cancelar</button>
        <button id="saveSettingsBtn" value="default" class="btn primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
