<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Chez Nutrition" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>Chez Nutrition</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Chez Team</div>
        <h1>Nutrición diaria</h1>
        <p id="todayLabel" class="muted"></p>
      </div>
      <div class="actions">
        <div class="date-nav" aria-label="Navegación por fecha">
          <button id="previousDayBtn" class="btn secondary" type="button" aria-label="Día anterior">‹</button>
          <button id="todayBtn" class="btn secondary" type="button">Hoy</button>
          <button id="nextDayBtn" class="btn secondary" type="button" aria-label="Día siguiente">›</button>
        </div>
        <button id="refreshBtn" class="btn secondary">Actualizar</button>
      </div>
    </header>

    <section id="statusBar" class="status hidden"></section>
    <section id="peopleGrid" class="people-grid"></section>

    <section class="charts-grid">
      <article class="panel chart-card">
        <div class="section-head">
          <div><div class="eyebrow">Evolución</div><h2>Peso</h2></div>
        </div>
        <canvas id="weightChart"></canvas>
      </article>
      <article class="panel chart-card">
        <div class="section-head">
          <div><div class="eyebrow">Evolución</div><h2>Calorías por día</h2></div>
        </div>
        <canvas id="calorieChart"></canvas>
      </article>
    </section>

    <section class="panel">
      <div class="section-head">
        <div><div id="intakesEyebrow" class="eyebrow">Hoy</div><h2>Ingestas</h2></div>
      </div>
      <div id="intakes" class="intakes"></div>
    </section>
  </main>
  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
