name: Boat Station APK validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/boat-station/core/**'
      - 'apps/boat-station/web/**'
      - '.github/workflows/boat-station-apk-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check changed web JavaScript
        run: |
          node --check apps/boat-station/web/runtime-mode.js
          node --check apps/boat-station/web/remote_landing.js
          node --check apps/boat-station/web/stations.js
          node --check apps/boat-station/web/data-sync.js
          node --check apps/boat-station/web/page-layout.js
          node --check apps/boat-station/web/pwa-version.js
      - name: Build debug APK
        run: gradle -p apps/boat-station/core :app:assembleDebug --stacktrace
