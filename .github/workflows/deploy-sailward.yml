name: Deploy Sailward

on:
  push:
    branches: [main]
    paths:
      - "apps/sailward/**"
      - ".github/workflows/deploy-sailward.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sailward
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/sailward/package-lock.json

      - name: Install and validate
        working-directory: apps/sailward
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Publish to Cloudflare Workers
        working-directory: apps/sailward
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Verify production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          subdomain="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).result.subdomain));')"
          curl --fail --silent --show-error --location \
            "https://sailward.${subdomain}.workers.dev/version.json" \
            | grep -Fq '"version": "0.1.0"'
