name: Prepare Wander startup centering

on:
  push:
    branches: [fix/wander-start-centered]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wander-start-centered
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply startup centering and version changes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const root = 'apps/wander-travel';
          const edit = (file, replacements) => {
            const path = `${root}/${file}`;
            let text = fs.readFileSync(path, 'utf8');
            for (const [from, to] of replacements) {
              if (!text.includes(from)) throw new Error(`Missing pattern in ${file}: ${from}`);
              text = text.replace(from, to);
            }
            fs.writeFileSync(path, text);
          };

          edit('runtime-map-controls.js', [
            ["let centerMode = loadCenterMode();", "let centerMode = 'middle';"],
            ["  persistCenterMode();\n  syncZoomAnchorMode();\n})();", "  persistCenterMode();\n  syncZoomAnchorMode();\n  setFollowMode(true, { centerNow: true });\n})();"],
          ]);

          edit('runtime-version.js', [["v0.109.9", "v0.109.10"]]);
          edit('package.json', [["0.109.9", "0.109.10"]]);
          edit('manifest.webmanifest', [["v0.109.9", "v0.109.10"]]);
          edit('android-version.json', [
            ['"versionName": "0.11.10"', '"versionName": "0.11.11"'],
            ['"versionCode": 26', '"versionCode": 27'],
          ]);

          edit('tests/app-shell.mjs', [
            ["'v0.109.9'", "'v0.109.10'"],
            ["'./?app=v0.109.9'", "'./?app=v0.109.10'"],
            ["'0.109.9'", "'0.109.10'"],
            ["'0.11.10'", "'0.11.11'"],
            ["androidVersion.versionCode, 26", "androidVersion.versionCode, 27"],
            ["  mapCore: read('runtime-map-core.js'),", "  mapCore: read('runtime-map-core.js'),\n  mapControls: read('runtime-map-controls.js'),"],
            ["assert.match(sources.mapCrosshair, /map-point-marker/);", "assert.match(sources.mapCrosshair, /map-point-marker/);\nassert.match(sources.mapControls, /let centerMode = 'middle'/);\nassert.match(sources.mapControls, /setFollowMode\\(true, \\{ centerNow: true \\}\\)/);"],
          ]);

          edit('tests/travel-log-memory.mjs', [
            ["v0\\.109\\.9", "v0\\.109\\.10"],
            ["./?app=v0.109.9", "./?app=v0.109.10"],
            ["0.109.9", "0.109.10"],
          ]);
          NODE
      - name: Remove preparation workflow
        run: rm .github/workflows/wander-start-centered-prep.yml
      - name: Commit prepared release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/wander-travel .github/workflows/wander-start-centered-prep.yml
          git commit -m "Start Wander centered on every launch"
          git push origin HEAD:fix/wander-start-centered
