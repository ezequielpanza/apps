name: Fix Wander Raw Track Tests

on:
  push:
    branches: [feature/wander-raw-track-recording]
    paths:
      - "scripts/fix-wander-raw-track-tests.py"
      - ".github/workflows/fix-wander-raw-track-tests.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wander-raw-track-recording
          fetch-depth: 0
      - run: python scripts/fix-wander-raw-track-tests.py
      - run: |
          rm scripts/fix-wander-raw-track-tests.py
          rm .github/workflows/fix-wander-raw-track-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align raw track migration tests"
          git push origin HEAD:feature/wander-raw-track-recording
