name: Apply Wander Field Tracking Fixes

on:
  push:
    branches: [fix/wander-direction-track-continuity]
    paths:
      - ".github/workflows/wander-field-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wander-direction-track-continuity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply source changes
        run: python3 .github/scripts/apply-wander-field-fixes.py

      - name: Run Wander tests
        run: |
          set -euo pipefail
          for test in $(find apps/wander-travel/tests -maxdepth 1 -name 'test-*.mjs' | sort); do
            echo "Running $test"
            node "$test"
          done

      - name: Commit applied fixes
        run: |
          rm .github/workflows/wander-field-fix.yml
          rm .github/scripts/apply-wander-field-fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize direction and track continuity"
          git push origin HEAD:fix/wander-direction-track-continuity
