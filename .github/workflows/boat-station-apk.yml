name: Boat Station APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/boat-station/core/**'
      - '.github/workflows/boat-station-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Read version
        id: version
        run: echo "version=$(tr -d '\r\n ' < apps/boat-station/core/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Restore permanent signing key
        shell: bash
        env:
          BOAT_STATION_KEYSTORE_BASE64: ${{ secrets.BOAT_STATION_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$BOAT_STATION_KEYSTORE_BASE64"
          printf '%s' "$BOAT_STATION_KEYSTORE_BASE64" | base64 --decode > apps/boat-station/core/boatstation-release.jks

      - name: Build signed Boat Station APK
        env:
          BOAT_STATION_KEYSTORE_PATH: ${{ github.workspace }}/apps/boat-station/core/boatstation-release.jks
          BOAT_STATION_KEYSTORE_PASSWORD: ${{ secrets.BOAT_STATION_KEYSTORE_PASSWORD }}
          BOAT_STATION_KEY_PASSWORD: ${{ secrets.BOAT_STATION_KEY_PASSWORD }}
          BOAT_STATION_KEY_ALIAS: boatstation
        run: gradle -p apps/boat-station/core :app:assembleRelease --stacktrace

      - name: Stage APK
        run: |
          mkdir -p apps/boat-station/core/releases
          cp apps/boat-station/core/app/build/outputs/apk/release/app-release.apk "apps/boat-station/core/releases/BoatStation-${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoatStation-${{ steps.version.outputs.version }}
          path: apps/boat-station/core/releases/BoatStation-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish APK in repository and Pages web root
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          APK="BoatStation-${{ steps.version.outputs.version }}.apk"
          cp "apps/boat-station/core/releases/$APK" "/tmp/$APK"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p apps/boat-station/core/releases apps/boat-station/web
          cp "/tmp/$APK" "apps/boat-station/core/releases/$APK"
          cp "/tmp/$APK" "apps/boat-station/web/$APK"
          cp "/tmp/$APK" "apps/boat-station/web/BoatStation.apk"
          printf '%s\n' "${{ steps.version.outputs.version }}" > apps/boat-station/web/APK_VERSION
          git add "apps/boat-station/core/releases/$APK" "apps/boat-station/web/$APK" apps/boat-station/web/BoatStation.apk apps/boat-station/web/APK_VERSION
          if git diff --cached --quiet; then
            echo "APK already published"
            exit 0
          fi
          git commit -m "Build Boat Station ${{ steps.version.outputs.version }} APK"
          git push origin HEAD:main
