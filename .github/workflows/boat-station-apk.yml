name: Boat Station APK

on:
  push:
    branches: [main]
    paths:
      - 'boat-station/**'
      - '.github/workflows/boat-station-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'boat-station/**'
      - '.github/workflows/boat-station-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Boat Station 0.0.9
        run: gradle -p boat-station :app:assembleDebug --stacktrace

      - name: Stage APK
        run: |
          mkdir -p boat-station/releases
          cp boat-station/app/build/outputs/apk/debug/app-debug.apk boat-station/releases/BoatStation-0.0.9.apk

      - name: Publish APK in repository
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boat-station/releases/BoatStation-0.0.9.apk
          git diff --cached --quiet || git commit -m 'Build Boat Station 0.0.9 APK'
          git push

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoatStation-0.0.9
          path: boat-station/releases/BoatStation-0.0.9.apk
          if-no-files-found: error