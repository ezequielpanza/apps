name: Deploy TapSense Restaurant

on:
  push:
    branches: [main]
    paths:
      - "apps/tapsense-restaurant/**"
      - ".github/workflows/deploy-tapsense-restaurant.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: tapsense-restaurant
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          projects=$(curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "$api")
          echo "$projects" | jq -e '.success == true' >/dev/null
          if ! echo "$projects" | jq -e --arg name "$PROJECT_NAME" '.result | any(.[]; .name == $name)' >/dev/null; then
            payload=$(jq -n --arg name "$PROJECT_NAME" --arg branch "main" '{name:$name, production_branch:$branch}')
            created=$(curl --fail --silent --show-error -X POST "$api" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data "$payload")
            echo "$created" | jq -e '.success == true' >/dev/null
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy apps/tapsense-restaurant --project-name=tapsense-restaurant --branch=main
