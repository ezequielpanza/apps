name: Deploy Boat Station Web

on:
  push:
    branches: [main]
    paths:
      - "apps/boat-station/web/**"
      - ".github/workflows/deploy-boat-station-remote.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Boat Station PWA
        shell: bash
        run: |
          set -euo pipefail
          test -f "apps/boat-station/web/index.html"
          test -f "apps/boat-station/web/sw.js"
          test -f "apps/boat-station/web/manifest.webmanifest"

      - name: Ensure Boat Station Web project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages project create boat-station-web --production-branch=main || true

      - name: Remove obsolete Remote project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages project delete boat-station-remote --yes || true

      - name: Deploy Boat Station Web to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy apps/boat-station/web --project-name=boat-station-web --branch=main
