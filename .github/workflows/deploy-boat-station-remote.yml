name: Deploy Boat Station Web

on:
  push:
    branches: [main]
    paths:
      - "apps/boat-station/web/**"
      - "apps/boat-station/remote/**"
      - ".github/workflows/deploy-boat-station-remote.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Boat Station PWAs
        shell: bash
        run: |
          set -euo pipefail
          for dir in apps/boat-station/web apps/boat-station/remote; do
            test -f "$dir/index.html"
            test -f "$dir/sw.js"
            test -f "$dir/manifest.webmanifest"
          done

      - name: Ensure Cloudflare Pages projects exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages project create boat-station-web --production-branch=main || true
          npx --yes wrangler@latest pages project create boat-station-remote --production-branch=main || true

      - name: Deploy Station Web to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy apps/boat-station/web --project-name=boat-station-web --branch=main

      - name: Deploy Remote PWA to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy apps/boat-station/remote --project-name=boat-station-remote --branch=main
