name: Deploy Boat Station

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release metadata and APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          root=Path('apps/boat-station/web')
          info=json.loads((root/'apk-release.json').read_text())
          apk=root/'BoatStation-LastVersion.apk'
          assert info['available'] is True and apk.is_file()
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==info['sha256']
          PYCODE
          find apps/boat-station/web -maxdepth 1 -type f -name '*.apk' ! -name 'BoatStation-LastVersion.apk' -delete

      - name: Validate canonical Boat Station web
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/boat-station/web/index.html
          test -f apps/boat-station/web/app.js
          test -f apps/boat-station/web/styles.css
          test -f apps/boat-station/web/stations.css
          ! grep -R "/clean/" apps/boat-station/web --exclude='*.apk'
          ! find apps/boat-station/web -type f -name 'patch_*' | grep -q .

      - name: Ensure Boat Station project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages project create boat-station --production-branch=main || true

      - name: Deploy Boat Station to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy apps/boat-station/web --project-name=boat-station --branch=main
