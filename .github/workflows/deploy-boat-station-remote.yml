name: Deploy Boat Station

on:
  push:
    branches: [main]
    paths:
      - "apps/boat-station/web/**"
      - "apps/boat-station/core/VERSION"
      - "apps/boat-station/core/releases/BoatStation-*.apk"
      - ".github/workflows/deploy-boat-station-remote.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage latest APK in PWA
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n ' < apps/boat-station/core/VERSION)"
          APK="apps/boat-station/core/releases/BoatStation-${VERSION}.apk"
          if [ -f "$APK" ]; then
            cp "$APK" "apps/boat-station/web/BoatStation-${VERSION}.apk"
            echo "$VERSION" > apps/boat-station/web/APK_VERSION
            printf '%s\n' "/BoatStation.apk /BoatStation-${VERSION}.apk 302" > apps/boat-station/web/_redirects
          fi

      - name: Validate canonical Boat Station web
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/boat-station/web/index.html
          test -f apps/boat-station/web/app.js
          test -f apps/boat-station/web/styles.css
          test -f apps/boat-station/web/stations.css
          ! grep -R "/clean/" apps/boat-station/web --exclude='*.apk'
          ! find apps/boat-station/web -type f -name 'patch_*' | grep -q .

      - name: Ensure Boat Station project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages project create boat-station --production-branch=main || true

      - name: Deploy Boat Station to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy apps/boat-station/web --project-name=boat-station --branch=main
