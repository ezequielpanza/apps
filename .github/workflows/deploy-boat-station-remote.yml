name: Deploy Boat Station Remote

on:
  push:
    branches: [main]
    paths:
      - "boat-station-remote/**"
      - "boat-station/VERSION"
      - ".github/workflows/deploy-boat-station-remote.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync version from Boat Station Local
        run: |
          VERSION=$(tr -d '\r\n ' < boat-station/VERSION)
          sed -i "s/boat-station-remote-[0-9.]*/boat-station-remote-$VERSION/" boat-station-remote/sw.js
          sed -i "s/<small id=\"version\">[^<]*/<small id=\"version\">$VERSION/" boat-station-remote/index.html

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages project create boat-station-remote --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy boat-station-remote --project-name=boat-station-remote --branch=main
