name: Deploy Boat Station Web

on:
  push:
    branches: [main]
    paths:
      - "boat-station-web/**"
      - ".github/workflows/deploy-boat-station-remote.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shared PWA
        shell: bash
        run: |
          set -euo pipefail
          test -f boat-station-web/index.html
          test -f boat-station-web/sw.js
          test -f boat-station-web/manifest.webmanifest
          test -f boat-station-web/VERSION
          echo "Deploying Boat Station Web $(cat boat-station-web/VERSION)"

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages project create boat-station-remote --production-branch=main || true

      - name: Deploy shared Web/Remote PWA to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy boat-station-web --project-name=boat-station-remote --branch=main
