name: Apply Wander Raw Track Backfill

on:
  push:
    branches: [feature/wander-raw-track-recording]
    paths:
      - "scripts/apply-wander-raw-track-backfill.py"
      - ".github/workflows/apply-wander-raw-track-backfill.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/wander-raw-track-recording
          fetch-depth: 0

      - name: Apply movement backfill
        run: python scripts/apply-wander-raw-track-backfill.py

      - name: Remove temporary migration files
        run: |
          rm scripts/apply-wander-raw-track-backfill.py
          rm .github/workflows/apply-wander-raw-track-backfill.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Backfill movement starts and preserve raw GPX metadata"
          git push origin HEAD:feature/wander-raw-track-recording
