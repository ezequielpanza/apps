name: Validate Contextum

on:
  pull_request:
    paths:
      - "apps/contextum/**"
      - "plugins/contextum/**"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/deploy-contextum.yml"
      - ".github/workflows/validate-contextum-plugin.yml"
  push:
    branches:
      - main
    paths:
      - "apps/contextum/**"
      - "plugins/contextum/**"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/deploy-contextum.yml"
      - ".github/workflows/validate-contextum-plugin.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check apps/contextum/app.js
          node --check apps/contextum/cloud-sync.js
          node --check apps/contextum/copy-code.js
          node --check apps/contextum/service-worker.js
          node --check apps/contextum/functions/mcp.js
          node --check apps/contextum/functions/health.js

      - name: Validate unified version
        run: |
          node <<'NODE'
          const fs = require("fs");
          const version = fs.readFileSync("apps/contextum/VERSION", "utf8").trim();
          const index = fs.readFileSync("apps/contextum/index.html", "utf8");
          const serviceWorker = fs.readFileSync("apps/contextum/service-worker.js", "utf8");
          const cloudSync = fs.readFileSync("apps/contextum/cloud-sync.js", "utf8");
          const mcp = fs.readFileSync("apps/contextum/functions/mcp.js", "utf8");
          const health = fs.readFileSync("apps/contextum/functions/health.js", "utf8");
          const manifest = JSON.parse(fs.readFileSync("plugins/contextum/.codex-plugin/plugin.json", "utf8"));

          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error("VERSION must be strict semver");
          const required = [
            [index, `Contextum v${version}`, "index title"],
            [index, `Context layer · v${version}`, "visible version"],
            [index, `styles.css?v=${version}`, "styles cache key"],
            [index, `app.js?v=${version}`, "app cache key"],
            [index, `cloud-sync.js?v=${version}`, "cloud sync cache key"],
            [index, `copy-code.js?v=${version}`, "copy code cache key"],
            [serviceWorker, `contextum-v${version}`, "service worker cache"],
            [cloudSync, `appVersion: "${version}"`, "snapshot version"],
            [mcp, `MCP_VERSION = "${version}"`, "MCP version"],
            [health, `SERVICE_VERSION = "${version}"`, "health version"]
          ];
          for (const [content, expected, label] of required) {
            if (!content.includes(expected)) throw new Error(`${label} is not synchronized to ${version}`);
          }
          if (manifest.version !== version) throw new Error("Plugin version is not synchronized");
          NODE

      - name: Validate plugin JSON
        run: |
          node <<'NODE'
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("plugins/contextum/.codex-plugin/plugin.json", "utf8"));
          const mcp = JSON.parse(fs.readFileSync("plugins/contextum/.mcp.json", "utf8"));
          const marketplace = JSON.parse(fs.readFileSync(".agents/plugins/marketplace.json", "utf8"));

          if (manifest.name !== "contextum") throw new Error("Invalid plugin name");
          if (!/^\d+\.\d+\.\d+$/.test(manifest.version)) throw new Error("Version must be strict semver");
          if (manifest.mcpServers !== "./.mcp.json") throw new Error("MCP manifest path is invalid");
          if (mcp.mcpServers?.contextum?.type !== "http") throw new Error("Contextum MCP must use HTTP");
          if (mcp.mcpServers?.contextum?.url !== "https://contextum.pages.dev/mcp") throw new Error("Unexpected MCP URL");
          if (!Array.isArray(manifest.interface?.defaultPrompt) || manifest.interface.defaultPrompt.length > 3) throw new Error("Invalid default prompts");
          if (!marketplace.plugins?.some((plugin) => plugin.name === "contextum")) throw new Error("Contextum is missing from marketplace");
          NODE

      - name: Validate skill
        run: |
          test -f plugins/contextum/skills/current-context/SKILL.md
          grep -q '^name: contextum-current-context$' plugins/contextum/skills/current-context/SKILL.md
          grep -q 'get_current_context' plugins/contextum/skills/current-context/SKILL.md
