<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Boat Station</title><style>
:root{--bg:#061522;--card:#0b2335;--card2:#0e2b40;--text:#f4f8fb;--muted:#94a7b6;--line:#17394f;--accent:#1ed7e5;--ok:#8bd332;--bad:#ff6e6e}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}.app{min-height:100vh;background:radial-gradient(circle at 70% -10%,#0d3450 0,#071c2d 34%,#061522 70%)}.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:14px;background:#061522f2;border-bottom:1px solid #103248}.brand{font-weight:850;letter-spacing:.05em}.brand b{color:var(--accent)}.iconbtn{width:40px;height:40px;border:0;border-radius:12px;background:#0b2639;color:#fff;font-size:22px}.content{padding:14px 12px 90px}.card{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:17px;margin-bottom:11px;overflow:hidden}.card-head{height:50px;display:flex;align-items:center;gap:8px;padding:9px 11px}.drag{color:#718797;padding:7px 4px}.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}.title-toggle{flex:1;display:flex;gap:6px;align-items:center;min-width:0}.title{font-weight:780}.summary{font-size:12px;color:var(--muted);max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{border:0;background:transparent;color:#fff;font-size:21px}.card-body{height:180px;padding:4px 14px 14px;overflow:hidden}.card.collapsed .card-body{height:0;padding:0;opacity:0}.view{display:none;height:100%}.view.active{display:block}.big{font-size:39px;font-weight:850;letter-spacing:-1px}.sub{font-size:13px;color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill,.metric{background:#113148;border:1px solid #173d55;border-radius:10px;padding:8px 10px;font-size:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric small{display:block;color:var(--muted);font-size:11px}.metric b{display:block;margin-top:2px}.pager{text-align:center;color:#617b8d;font-size:12px;letter-spacing:3px;margin-top:10px}.pager .on{color:var(--accent)}.sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:200}.sheet.open{display:flex}.sheet-inner{width:100%;background:#0b2335;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:17px 16px calc(24px + env(safe-area-inset-bottom));height:min(86dvh,800px);overflow-y:auto}.handle{width:44px;height:5px;background:#315064;border-radius:99px;margin:0 auto 16px}.option{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line)}.btn{border:1px solid #24516a;background:#102f45;color:#fff;border-radius:10px;padding:9px 11px}.field,.select{background:#071827;color:#fff;border:1px solid #24516a;border-radius:9px;padding:9px}.field{width:130px}.danger{color:var(--bad)}.battery-card{border:1px solid var(--line);border-radius:13px;padding:10px;margin:9px 0;background:#081c2b}.battery-top{display:flex;align-items:center;gap:8px}.battery-top .name{flex:1;font-weight:750}.status{font-size:11px;color:var(--muted)}.status.ok{color:#c9f59b}.bank{margin:8px 0;padding:8px 10px;background:#0d2a3e;border-radius:10px}.bank b{display:block}.bank small{color:var(--muted)}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#102e43;border:1px solid #1c536d;padding:10px 13px;border-radius:10px;opacity:0;z-index:400}.toast.show{opacity:1}.scan-item{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.footer{position:fixed;bottom:10px;left:0;right:0;text-align:center;pointer-events:none}.footer span{background:#061522ee;border:1px solid var(--line);padding:7px 10px;border-radius:99px;font-size:10px;color:#b8c7d1}
</style></head><body><div class="app"><div class="topbar"><button class="iconbtn" id="menuBtn">☰</button><div class="brand">BOAT <b>STATION</b></div><button class="iconbtn" id="addBtn">＋</button></div><div class="content" id="cards"></div></div><div class="footer"><span>Título: minimizar/restaurar · swipe: cambiar vista</span></div><div class="toast" id="toast"></div>
<div class="sheet" id="addSheet"><div class="sheet-inner"><div class="handle"></div><h3>Agregar tarjeta</h3><div id="sensorList"></div></div></div><div class="sheet" id="menuSheet"><div class="sheet-inner"><div class="handle"></div><h3>Boat Station</h3><div class="option"><span>Versión</span><small>0.0.8</small></div></div></div><div class="sheet" id="configSheet"><div class="sheet-inner"><div class="handle"></div><h3 id="configTitle"></h3><div id="configBody"></div><div class="option danger" id="removeCard">Quitar tarjeta</div></div></div>
<script>
const catalog={gps:{name:'GPS'},phone:{name:'Estado del teléfono'},seastate:{name:'Sea State'},batteries:{name:'Baterías'},compass:{name:'Brújula'},motion:{name:'Movimiento'}};let order=JSON.parse(localStorage.getItem('bs.order')||'["gps","phone","seastate"]');let collapsed=JSON.parse(localStorage.getItem('bs.collapsed')||'{}');let views=JSON.parse(localStorage.getItem('bs.views')||'{}');let seaFactor=Number(localStorage.getItem('bs.seaFactor')||1);let state={gps:null,phone:null,heading:0,motion:0,seaAvg:0,seaPeak:0,wave:0,batteries:{}};let motionSamples=[],lastSea=0,scanResults={},currentConfig=null,currentBatteryId=null;
const $=q=>document.querySelector(q),cards=$('#cards');function save(){localStorage.setItem('bs.order',JSON.stringify(order));localStorage.setItem('bs.collapsed',JSON.stringify(collapsed));localStorage.setItem('bs.views',JSON.stringify(views));localStorage.setItem('bs.seaFactor',seaFactor)}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1500)}function dots(n,i){return `<div class="pager">${Array.from({length:n},(_,x)=>`<span class="${x===i?'on':''}">${x===i?'●':'○'}</span>`).join(' ')}</div>`}function fmt(v){return Number(v).toFixed(6)+'°'}function bankName(b){return (b.bank||'').trim()||'Sin banco'}
function banks(){let map={};Object.values(state.batteries).forEach(b=>{let n=bankName(b);if(!map[n])map[n]=[];map[n].push(b)});return map}function bankStats(list){let withData=list.filter(x=>Number.isFinite(x.soc));let cap=list.reduce((a,x)=>a+(Number(x.capacityAh)||Number(x.totalAh)||0),0);let soc=null;if(withData.length){let denom=withData.reduce((a,x)=>a+(Number(x.capacityAh)||Number(x.totalAh)||1),0);soc=withData.reduce((a,x)=>a+x.soc*(Number(x.capacityAh)||Number(x.totalAh)||1),0)/denom}let connected=list.filter(x=>x.connected).length;let voltage=withData.length?withData.reduce((a,x)=>a+(x.voltage||0),0)/withData.length:null;let current=withData.reduce((a,x)=>a+(x.current||0),0);return{soc,cap,connected,total:list.length,voltage,current}}
function batterySummary(){let n=Object.keys(state.batteries).length,c=Object.values(state.batteries).filter(x=>x.connected).length;return n?`${c}/${n} conectadas`:'Sin baterías'}
function body(id){let i=views[id]||0;if(id==='gps')return `<div class="view"><div class="big" data-lat>Esperando GPS…</div><div class="big" data-lon>—</div>${dots(2,i)}</div><div class="view"><div class="big" data-speed>0.0 kn</div><div class="sub" data-bearing>Rumbo —</div>${dots(2,i)}</div>`;if(id==='phone')return `<div class="view"><div class="big" data-pbat>—%</div><div class="sub" data-pcharge>Estado</div><div class="row"><span class="pill" data-ptemp>—°C</span><span class="pill" data-net>—</span></div></div>`;if(id==='seastate')return `<div class="view"><div class="big" data-wave>0.00 m</div><div class="sub">Altura de ola estimada · promedio 30 s</div><div class="row"><span class="pill" data-mavg>Movimiento 0.00</span><span class="pill" data-mpeak>Pico 0.00</span></div></div>`;if(id==='compass')return `<div class="view"><div class="big" data-heading>—°</div><div class="sub">Rumbo magnético</div></div>`;if(id==='motion')return `<div class="view"><div class="big" data-motion>0.00</div><div class="sub">m/s²</div></div>`;if(id==='batteries')return `<div class="view"><div id="banksView"></div>${dots(2,i)}</div><div class="view"><div id="batteryListView"></div>${dots(2,i)}</div>`;return''}
function card(id){return `<section class="card ${collapsed[id]?'collapsed':''}" data-id="${id}"><div class="card-head"><span class="drag">⋮⋮</span><span class="dot"></span><div class="title-toggle"><span>▾</span><span class="title">${catalog[id].name}</span></div><span class="summary">${id==='batteries'?batterySummary():'Activo'}</span><button class="more">⋯</button></div><div class="card-body">${body(id)}</div></section>`}function render(){cards.innerHTML=order.filter(x=>catalog[x]).map(card).join('');cards.querySelectorAll('.card').forEach(c=>setView(c));bindCards();applyLive();renderSensors()}function setView(c){let vs=[...c.querySelectorAll('.view')],i=Math.min(views[c.dataset.id]||0,Math.max(0,vs.length-1));vs.forEach((v,x)=>v.classList.toggle('active',x===i));c.querySelectorAll('.pager').forEach(p=>[...p.children].forEach((s,x)=>{s.classList.toggle('on',x===i);s.textContent=x===i?'●':'○'}))}
function bindCards(){cards.querySelectorAll('.title-toggle').forEach(x=>x.onclick=()=>{let c=x.closest('.card'),id=c.dataset.id;c.classList.toggle('collapsed');collapsed[id]=c.classList.contains('collapsed');save()});cards.querySelectorAll('.more').forEach(x=>x.onclick=()=>openConfig(x.closest('.card').dataset.id));cards.querySelectorAll('.card-body').forEach(b=>{let sx=0,sy=0;b.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};b.ontouchend=e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){let c=b.closest('.card'),vs=[...c.querySelectorAll('.view')];if(vs.length>1){let i=(views[c.dataset.id]||0)+(dx<0?1:-1);views[c.dataset.id]=(i+vs.length)%vs.length;save();setView(c)}}}})}
function renderBanks(){let e=$('#banksView');if(!e)return;let bs=banks(),names=Object.keys(bs);e.innerHTML=names.length?names.map(n=>{let s=bankStats(bs[n]);return `<div class="bank"><b>${esc(n)} ${s.soc!=null?'· '+s.soc.toFixed(0)+'%':''}</b><small>${s.connected}/${s.total} conectadas${s.cap?' · '+s.cap.toFixed(0)+' Ah':''}${s.voltage!=null?' · '+s.voltage.toFixed(2)+' V':''}${s.current?' · '+s.current.toFixed(1)+' A':''}</small></div>`}).join(''):'<div class="sub">No hay baterías. Abrí ⋯ y tocá + Agregar batería.</div>'}
function renderBatteryList(){let e=$('#batteryListView');if(!e)return;let list=Object.values(state.batteries);e.innerHTML=list.length?list.map(b=>`<div class="battery-card"><div class="battery-top"><span class="name">${esc(b.name||'Batería')}</span><span class="status ${b.connected?'ok':''}">${b.connected?'Conectada':'Desconectada'}</span></div><div class="sub">${esc(bankName(b))}${b.detectedBms?' · '+esc(b.detectedBms):''}</div>${Number.isFinite(b.soc)?`<div class="row"><span class="pill">${b.soc.toFixed(0)}%</span><span class="pill">${b.voltage.toFixed(2)} V</span><span class="pill">${b.current.toFixed(1)} A</span><span class="pill">${b.power.toFixed(0)} W</span></div>`:''}</div>`).join(''):'<div class="sub">Sin baterías configuradas.</div>'}
function applyLive(){if(state.gps){set('[data-lat]',fmt(state.gps.lat));set('[data-lon]',fmt(state.gps.lon));set('[data-speed]',state.gps.speedKts.toFixed(1)+' kn');set('[data-bearing]','Rumbo '+Math.round(state.gps.bearing)+'°')}if(state.phone){set('[data-pbat]',state.phone.battery+'%');set('[data-pcharge]',state.phone.charging?'Cargando':'Usando batería');set('[data-ptemp]',state.phone.batteryTemp.toFixed(1)+'°C');set('[data-net]',state.phone.network)}set('[data-heading]',Math.round(state.heading)+'°');set('[data-motion]',state.motion.toFixed(2));set('[data-wave]',state.wave.toFixed(2)+' m');set('[data-mavg]','Movimiento '+state.seaAvg.toFixed(2));set('[data-mpeak]','Pico '+state.seaPeak.toFixed(2));let bc=document.querySelector('.card[data-id="batteries"] .summary');if(bc)bc.textContent=batterySummary();renderBanks();renderBatteryList()}
function recalcSea(force){let now=Date.now();motionSamples=motionSamples.filter(x=>now-x.t<=30000);if(!motionSamples.length)return;if(!force&&now-lastSea<5000)return;lastSea=now;state.seaAvg=motionSamples.reduce((a,x)=>a+x.v,0)/motionSamples.length;state.seaPeak=Math.max(...motionSamples.map(x=>x.v));state.wave=state.seaAvg*seaFactor;applyLive()}
function renderSensors(){let l=$('#sensorList');l.innerHTML=Object.entries(catalog).map(([id,c])=>`<div class="option" data-add="${id}"><span>${c.name}</span><span>${order.includes(id)?'✓':'＋'}</span></div>`).join('');l.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>{let id=x.dataset.add;if(!order.includes(id)){order.push(id);save();render()}$('#addSheet').classList.remove('open')})}
function openConfig(id){currentConfig=id;$('#configTitle').textContent=catalog[id].name;let b=$('#configBody');if(id==='seastate')b.innerHTML=`<div class="option"><span>Factor de ola</span><input id="seaFactor" class="field" type="number" step="0.05" value="${seaFactor}"></div>`;else if(id==='batteries')b.innerHTML=batteryConfigHtml();else b.innerHTML='<div class="sub">Sin ajustes adicionales por ahora.</div>';$('#configSheet').classList.add('open');setTimeout(()=>{let f=$('#seaFactor');if(f)f.onchange=()=>{seaFactor=Math.max(0,Number(f.value)||0);save();recalcSea(true)};bindBatteryConfig()},0)}
function batteryConfigHtml(){let list=Object.values(state.batteries);return `<div class="option"><span>Baterías configuradas</span><button class="btn" id="addBattery">＋ Agregar</button></div><div class="sub">Sin límite fijo. Nombre, banco, capacidad y BMS son configurables por batería. Humsienk se detecta automáticamente cuando corresponde.</div><div id="batteryCfgList">${list.map(b=>batteryCfg(b)).join('')}</div><div id="scanArea"></div>`}function batteryCfg(b){return `<div class="battery-card" data-cfg-id="${b.id}"><div class="battery-top"><span class="name">${esc(b.name||'Batería')}</span><button class="more" data-bmore="${b.id}">⋯</button></div><div class="sub">${esc(bankName(b))} · ${b.capacityAh?b.capacityAh+' Ah':'Capacidad automática/manual'} · ${b.detectedBms||b.bmsType||'Auto'}</div></div>`}
function bindBatteryConfig(){let a=$('#addBattery');if(a)a.onclick=()=>editBattery(null);document.querySelectorAll('[data-bmore]').forEach(x=>x.onclick=()=>editBattery(Number(x.dataset.bmore)))}function editBattery(id){currentBatteryId=id;let b=id!=null?state.batteries[id]:null;$('#configBody').innerHTML=`<h3>${b?'Configurar batería':'Agregar batería'}</h3><div class="option"><span>Nombre</span><input id="bName" class="field" value="${escAttr(b?.name||'')}"></div><div class="option"><span>Banco</span><input id="bBank" class="field" value="${escAttr(b?.bank||'')}"></div><div class="option"><span>Capacidad Ah<br><small>0 = intentar detectar</small></span><input id="bCap" class="field" type="number" min="0" value="${b?.capacityAh||0}"></div><div class="option"><span>Tipo de BMS</span><select id="bBms" class="select"><option value="auto">Automático</option><option value="humsienk">Humsienk</option><option value="other">Otro / no compatible</option></select></div>${b?`<div class="option"><span>Bluetooth<br><small>${esc(b.address||'No vinculado')}</small></span><button class="btn" id="scanBattery">${b.address?'Cambiar':'Vincular'}</button></div>`:''}<div class="option"><button class="btn" id="saveBattery">Guardar</button>${b?'<button class="btn danger" id="deleteBattery">Eliminar</button>':''}</div><div id="scanArea"></div>`;$('#bBms').value=b?.bmsType||'auto';$('#saveBattery').onclick=()=>{let name=$('#bName').value,bank=$('#bBank').value,cap=Number($('#bCap').value)||0,bms=$('#bBms').value;if(id==null&&window.NativeBridge){let newId=NativeBridge.addBattery(name,bank,cap,bms);toast('Batería agregada');setTimeout(()=>{loadBatteries();editBattery(Number(newId))},200)}else if(window.NativeBridge){NativeBridge.updateBattery(id,name,bank,cap,bms);toast('Configuración guardada');setTimeout(loadBatteries,200)}};let s=$('#scanBattery');if(s)s.onclick=()=>startScan(id);let d=$('#deleteBattery');if(d)d.onclick=()=>{if(window.NativeBridge){NativeBridge.deleteBattery(id);delete state.batteries[id];toast('Batería eliminada');setTimeout(()=>{loadBatteries();openConfig('batteries')},200)}}}
function startScan(id){currentBatteryId=id;scanResults={};$('#scanArea').innerHTML='<div class="sub">Buscando dispositivos BLE…</div>';if(window.NativeBridge)NativeBridge.startBatteryScan()}function renderScan(){let a=$('#scanArea');if(!a)return;let rows=Object.values(scanResults).sort((x,y)=>y.rssi-x.rssi);a.innerHTML=rows.map(d=>`<div class="scan-item"><span><b>${esc(d.name||'BLE sin nombre')}</b><br><small>${esc(d.address)} · ${d.rssi} dBm</small></span><button class="btn" data-pick="${d.address}">Usar</button></div>`).join('');a.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>{if(window.NativeBridge){NativeBridge.setBatteryAddress(currentBatteryId,x.dataset.pick);toast('Bluetooth vinculado');setTimeout(loadBatteries,400)}})}
function loadBatteries(){try{let arr=window.NativeBridge?JSON.parse(NativeBridge.getSavedBatteries()||'[]'):[];let fresh={};arr.forEach(b=>{fresh[b.id]={...(state.batteries[b.id]||{}),...b}});state.batteries=fresh;applyLive();if(currentConfig==='batteries'&&$('#configSheet').classList.contains('open'))openConfig('batteries')}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function escAttr(s){return esc(s)}function set(q,v){let e=$(q);if(e)e.textContent=v}
function sheet(id,btn){$(btn).onclick=()=>$(id).classList.add('open');$(id).onclick=e=>{if(e.target===$(id))$(id).classList.remove('open')}}sheet('#addSheet','#addBtn');sheet('#menuSheet','#menuBtn');$('#configSheet').onclick=e=>{if(e.target===$('#configSheet'))$('#configSheet').classList.remove('open')};$('#removeCard').onclick=()=>{if(currentConfig){order=order.filter(x=>x!==currentConfig);save();$('#configSheet').classList.remove('open');render()}}
window.BoatStation={updateGPS:o=>{state.gps=o;applyLive()},updatePhone:o=>{state.phone=o;applyLive()},updateCompass:h=>{state.heading=Number(h)||0;applyLive()},updateMotion:m=>{state.motion=Number(m)||0;motionSamples.push({t:Date.now(),v:state.motion});recalcSea(false)},onBleScanResult:o=>{scanResults[o.address]=o;renderScan()},onBatteryConnection:o=>{state.batteries[o.id]={...(state.batteries[o.id]||{}),...o};applyLive()},onBatteryData:o=>{state.batteries[o.id]={...(state.batteries[o.id]||{}),...o};applyLive()},onBatteryServices:o=>{},onBatteryRaw:o=>{}};render();setTimeout(loadBatteries,500);setInterval(()=>recalcSea(true),5000);
</script></body></html>
