<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Boat Station</title><style>
:root{--bg:#061522;--card:#0b2335;--card2:#0e2b40;--text:#f4f8fb;--muted:#94a7b6;--line:#17394f;--accent:#1ed7e5;--ok:#8bd332;--bad:#ff6e6e}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}.app{min-height:100vh;background:radial-gradient(circle at 70% -10%,#0d3450 0,#071c2d 34%,#061522 70%)}.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:14px;background:#061522f2;border-bottom:1px solid #103248}.brand{font-weight:850;letter-spacing:.05em}.brand b{color:var(--accent)}.iconbtn{width:40px;height:40px;border:0;border-radius:12px;background:#0b2639;color:#fff;font-size:22px}.content{padding:14px 12px 90px}.card{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:17px;margin-bottom:11px;overflow:hidden;transform-style:preserve-3d;transition:transform .18s,opacity .18s}.card-head{height:50px;display:flex;align-items:center;gap:8px;padding:9px 11px}.drag{color:#718797;padding:7px 4px}.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}.title-toggle{flex:1;display:flex;gap:6px;align-items:center;min-width:0}.title{font-weight:780}.summary{font-size:12px;color:var(--muted);max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{border:0;background:transparent;color:#fff;font-size:21px;padding:8px}.card-body{height:184px;padding:4px 14px 14px;overflow:hidden;transition:height .2s,padding .2s,opacity .16s}.card.collapsed .card-body{height:0;padding:0;opacity:0}.view{display:none;height:100%}.view.active{display:block}.big{font-size:39px;font-weight:850;letter-spacing:-1px}.sub{font-size:13px;color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{background:#113148;border:1px solid #173d55;border-radius:10px;padding:8px 10px;font-size:13px}.pager{text-align:center;color:#617b8d;font-size:12px;letter-spacing:3px;margin-top:10px}.pager .on{color:var(--accent)}.sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:200}.sheet.open{display:flex}.sheet-inner{width:100%;background:#0b2335;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:17px 16px 28px;height:86vh;overflow-y:auto}.handle{width:44px;height:5px;background:#315064;border-radius:99px;margin:0 auto 16px}.option{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line)}.btn{border:1px solid #24516a;background:#102f45;color:#fff;border-radius:10px;padding:9px 11px}.field,.select{background:#071827;color:#fff;border:1px solid #24516a;border-radius:9px;padding:9px}.field{width:150px}.danger{color:var(--bad)}.bank,.battery-card{border:1px solid var(--line);border-radius:13px;padding:10px;margin:9px 0;background:#081c2b}.bank-head,.battery-top{display:flex;align-items:center;gap:8px}.bank-head .name,.battery-top .name{flex:1;font-weight:750}.status{font-size:11px;color:var(--muted)}.status.ok{color:#c9f59b}.bank-soc{font-size:28px;font-weight:850;margin-top:5px}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#102e43;border:1px solid #1c536d;padding:10px 13px;border-radius:10px;opacity:0;z-index:400;transition:opacity .15s}.toast.show{opacity:1}.scan-item{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.footer{position:fixed;bottom:10px;left:0;right:0;text-align:center;pointer-events:none}.footer span{background:#061522ee;border:1px solid var(--line);padding:7px 10px;border-radius:99px;font-size:10px;color:#b8c7d1}.backrow{display:flex;align-items:center;gap:8px;margin-bottom:12px}.card.flip-out-left{animation:outL .16s forwards}.card.flip-in-right{animation:inR .20s forwards}.card.flip-out-right{animation:outR .16s forwards}.card.flip-in-left{animation:inL .20s forwards}@keyframes outL{to{transform:perspective(850px) rotateY(-82deg);opacity:.45}}@keyframes inR{from{transform:perspective(850px) rotateY(82deg);opacity:.45}to{transform:rotateY(0);opacity:1}}@keyframes outR{to{transform:perspective(850px) rotateY(82deg);opacity:.45}}@keyframes inL{from{transform:perspective(850px) rotateY(-82deg);opacity:.45}to{transform:rotateY(0);opacity:1}}
</style></head><body><div class="app"><div class="topbar"><button class="iconbtn" id="menuBtn">☰</button><div class="brand">BOAT <b>STATION</b></div><button class="iconbtn" id="addBtn">＋</button></div><div class="content" id="cards"></div></div><div class="footer"><span>Título: minimizar/restaurar · swipe: cambiar vista</span></div><div class="toast" id="toast"></div><div class="sheet" id="addSheet"><div class="sheet-inner"><div class="handle"></div><h3>Agregar tarjeta</h3><div id="sensorList"></div></div></div><div class="sheet" id="menuSheet"><div class="sheet-inner"><div class="handle"></div><h3>Boat Station</h3><div class="option"><span>Versión</span><small>0.0.11</small></div></div></div><div class="sheet" id="configSheet"><div class="sheet-inner"><div class="handle"></div><h3 id="configTitle"></h3><div id="configBody"></div><div class="option danger" id="removeCard">Quitar tarjeta</div></div></div><script>
(function(){
var catalog={gps:{name:'GPS'},phone:{name:'Estado del teléfono'},seastate:{name:'Sea State'},batteries:{name:'Baterías'},compass:{name:'Brújula'},motion:{name:'Movimiento'}};
function readJson(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
var order=readJson('bs.order',['gps','phone','seastate','batteries']),collapsed=readJson('bs.collapsed',{}),views=readJson('bs.views',{}),seaFactor=Number(localStorage.getItem('bs.seaFactor')||1);var state={gps:null,phone:null,heading:0,motion:0,seaAvg:0,seaPeak:0,wave:0,banks:{},batteries:{}};var motionSamples=[],lastSea=0,scanResults={},currentConfig=null,currentBatteryId=null,suppressClickUntil=0;function $(q){return document.querySelector(q)}var cards=$('#cards');
function save(){localStorage.setItem('bs.order',JSON.stringify(order));localStorage.setItem('bs.collapsed',JSON.stringify(collapsed));localStorage.setItem('bs.views',JSON.stringify(views));localStorage.setItem('bs.seaFactor',String(seaFactor))}
function toast(t){var e=$('#toast');if(!e)return;e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('show')},1600)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]})}function set(q,v){var e=$(q);if(e)e.textContent=v}function vals(o){var a=[];for(var k in o)if(Object.prototype.hasOwnProperty.call(o,k))a.push(o[k]);return a}
function dots(n,i){var h='<div class="pager">';for(var x=0;x<n;x++)h+='<span class="'+(x===i?'on':'')+'">'+(x===i?'●':'○')+'</span> ';return h+'</div>'}function fmt(v){return Number(v).toFixed(6)+'°'}
function batteriesForBank(id){var all=vals(state.batteries),out=[];for(var i=0;i<all.length;i++)if(Number(all[i].bankId)===Number(id))out.push(all[i]);return out}
function bankStats(id){var list=batteriesForBank(id),withData=[],connected=0,cap=0,current=0,voltSum=0;for(var i=0;i<list.length;i++){var b=list[i];if(b.connected)connected++;cap+=Number(b.capacityAh)||Number(b.totalAh)||0;if(isFinite(Number(b.soc))){withData.push(b);current+=Number(b.current)||0;voltSum+=Number(b.voltage)||0}}var den=0,num=0;for(i=0;i<withData.length;i++){var w=Number(withData[i].capacityAh)||Number(withData[i].totalAh)||1;den+=w;num+=Number(withData[i].soc)*w}var soc=den?num/den:null,voltage=withData.length?voltSum/withData.length:null;return{list:list,connected:connected,total:list.length,soc:soc,cap:cap,voltage:voltage,current:current,power:voltage==null?null:voltage*current}}
function batterySummary(){var all=vals(state.batteries),n=all.length,c=0;for(var i=0;i<n;i++)if(all[i].connected)c++;var banks=vals(state.banks),only=null,count=0;for(i=0;i<banks.length;i++){var s=bankStats(banks[i].id);if(s.soc!=null){only=s;count++}}if(count===1)return only.soc.toFixed(0)+'% · '+c+'/'+n;return n?c+'/'+n+' conectadas':'Sin baterías'}
function body(id){var i=views[id]||0;if(id==='gps')return '<div class="view"><div class="big" data-lat>Esperando GPS…</div><div class="big" data-lon>—</div>'+dots(2,i)+'</div><div class="view"><div class="big" data-speed>0.0 kn</div><div class="sub" data-bearing>Rumbo —</div>'+dots(2,i)+'</div>';if(id==='phone')return '<div class="view"><div class="big" data-pbat>—%</div><div class="sub" data-pcharge>Estado</div><div class="row"><span class="pill" data-ptemp>—°C</span><span class="pill" data-net>—</span></div></div>';if(id==='seastate')return '<div class="view"><div class="big" data-wave>0.00 m</div><div class="sub">Altura de ola estimada · promedio 30 s</div><div class="row"><span class="pill" data-mavg>Movimiento 0.00</span><span class="pill" data-mpeak>Pico 0.00</span></div></div>';if(id==='compass')return '<div class="view"><div class="big" data-heading>—°</div><div class="sub">Rumbo magnético</div></div>';if(id==='motion')return '<div class="view"><div class="big" data-motion>0.00</div><div class="sub">m/s²</div></div>';if(id==='batteries')return '<div class="view"><div id="banksView"></div>'+dots(2,i)+'</div><div class="view"><div id="batteryListView"></div>'+dots(2,i)+'</div>';return ''}
function card(id){return '<section class="card '+(collapsed[id]?'collapsed':'')+'" data-id="'+id+'"><div class="card-head"><span class="drag">⋮⋮</span><span class="dot"></span><div class="title-toggle"><span>▾</span><span class="title">'+catalog[id].name+'</span></div><span class="summary">'+(id==='batteries'?batterySummary():'Activo')+'</span><button class="more">⋯</button></div><div class="card-body">'+body(id)+'</div></section>'}
function render(){var h='';for(var i=0;i<order.length;i++)if(catalog[order[i]])h+=card(order[i]);cards.innerHTML=h;var cs=cards.querySelectorAll('.card');for(i=0;i<cs.length;i++)setView(cs[i]);bindCards();applyLive();renderSensors()}
function setView(c){var vs=c.querySelectorAll('.view'),i=Math.min(views[c.getAttribute('data-id')]||0,Math.max(0,vs.length-1));for(var x=0;x<vs.length;x++)vs[x].classList.toggle('active',x===i);var ps=c.querySelectorAll('.pager');for(x=0;x<ps.length;x++){var ch=ps[x].children;for(var y=0;y<ch.length;y++){ch[y].classList.toggle('on',y===i);ch[y].textContent=y===i?'●':'○'}}}
function cycleView(c,dir){var vs=c.querySelectorAll('.view');if(vs.length<2||c.getAttribute('data-flipping')==='1')return;var id=c.getAttribute('data-id'),cur=views[id]||0,next=(cur+dir+vs.length)%vs.length;c.setAttribute('data-flipping','1');var out=dir>0?'flip-out-left':'flip-out-right',inn=dir>0?'flip-in-right':'flip-in-left';c.classList.add(out);setTimeout(function(){views[id]=next;save();setView(c);c.classList.remove(out);c.classList.add(inn);setTimeout(function(){c.classList.remove(inn);c.setAttribute('data-flipping','0')},205)},155)}
function bindCards(){var ts=cards.querySelectorAll('.title-toggle'),i;for(i=0;i<ts.length;i++)ts[i].onclick=function(){if(Date.now()<suppressClickUntil)return;var c=this.closest('.card'),id=c.getAttribute('data-id');c.classList.toggle('collapsed');collapsed[id]=c.classList.contains('collapsed');save()};var ms=cards.querySelectorAll('.more');for(i=0;i<ms.length;i++)ms[i].onclick=function(e){e.stopPropagation();if(Date.now()<suppressClickUntil)return;openConfig(this.closest('.card').getAttribute('data-id'))};var cs=cards.querySelectorAll('.card');for(i=0;i<cs.length;i++)(function(c){var sx=0,sy=0;c.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});c.addEventListener('touchend',function(e){if(!e.changedTouches.length)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy)*1.2){suppressClickUntil=Date.now()+350;cycleView(c,dx<0?1:-1)}},{passive:true})})(cs[i])}
function renderBanks(){var e=$('#banksView');if(!e)return;var list=vals(state.banks),h='';if(!list.length){e.innerHTML='<div class="sub">No hay bancos configurados.</div>';return}for(var i=0;i<list.length;i++){var b=list[i],s=bankStats(b.id);h+='<div class="bank"><div class="bank-head"><span class="name">'+esc(b.name)+'</span><span class="status '+(s.connected?'ok':'')+'">'+s.connected+'/'+s.total+'</span></div><div class="bank-soc">'+(s.soc==null?'—%':s.soc.toFixed(0)+'%')+'</div><div class="sub">'+(s.voltage==null?'Sin datos BMS':s.voltage.toFixed(2)+' V · '+s.current.toFixed(1)+' A · '+(s.power||0).toFixed(0)+' W')+(s.cap?' · '+s.cap.toFixed(0)+' Ah':'')+'</div></div>'}e.innerHTML=h}
function renderBatteryList(){var e=$('#batteryListView');if(!e)return;var banks=vals(state.banks),h='';if(!banks.length){e.innerHTML='<div class="sub">Sin bancos.</div>';return}for(var i=0;i<banks.length;i++){var bank=banks[i],list=batteriesForBank(bank.id);h+='<div class="sub" style="margin:4px 0 6px"><b>'+esc(bank.name)+'</b></div>';if(!list.length){h+='<div class="sub">Sin baterías en este banco.</div>';continue}for(var j=0;j<list.length;j++){var b=list[j];h+='<div class="battery-card"><div class="battery-top"><span class="name">'+esc(b.name)+'</span><span class="status '+(b.connected?'ok':'')+'">'+(b.connected?'Conectada':'Desconectada')+'</span></div>';if(isFinite(Number(b.soc)))h+='<div class="bank-soc">'+Number(b.soc).toFixed(0)+'%</div><div class="sub">'+Number(b.voltage||0).toFixed(2)+' V · '+Number(b.current||0).toFixed(1)+' A · '+Number(b.power||0).toFixed(0)+' W'+(isFinite(Number(b.remainingAh))?' · '+Number(b.remainingAh).toFixed(0)+' Ah':'')+'</div>';else h+='<div class="sub">'+(b.connected?'Esperando datos del BMS…':'Sin datos')+'</div>';h+='</div>'}}e.innerHTML=h}
function applyLive(){if(state.gps){set('[data-lat]',fmt(state.gps.lat));set('[data-lon]',fmt(state.gps.lon));set('[data-speed]',Number(state.gps.speedKts||0).toFixed(1)+' kn');set('[data-bearing]','Rumbo '+Math.round(state.gps.bearing||0)+'°')}if(state.phone){set('[data-pbat]',state.phone.battery+'%');set('[data-pcharge]',state.phone.charging?'Cargando':'Usando batería');set('[data-ptemp]',Number(state.phone.batteryTemp||0).toFixed(1)+'°C');set('[data-net]',state.phone.network)}set('[data-heading]',Math.round(state.heading)+'°');set('[data-motion]',Number(state.motion).toFixed(2));set('[data-wave]',Number(state.wave).toFixed(2)+' m');set('[data-mavg]','Movimiento '+Number(state.seaAvg).toFixed(2));set('[data-mpeak]','Pico '+Number(state.seaPeak).toFixed(2));var bc=document.querySelector('.card[data-id="batteries"] .summary');if(bc)bc.textContent=batterySummary();renderBanks();renderBatteryList()}
function recalcSea(force){var now=Date.now(),keep=[];for(var i=0;i<motionSamples.length;i++)if(now-motionSamples[i].t<=30000)keep.push(motionSamples[i]);motionSamples=keep;if(!motionSamples.length)return;if(!force&&now-lastSea<5000)return;lastSea=now;var sum=0,peak=0;for(i=0;i<motionSamples.length;i++){sum+=motionSamples[i].v;if(motionSamples[i].v>peak)peak=motionSamples[i].v}state.seaAvg=sum/motionSamples.length;state.seaPeak=peak;state.wave=state.seaAvg*seaFactor;applyLive()}
function renderSensors(){var l=$('#sensorList'),h='';for(var id in catalog)if(Object.prototype.hasOwnProperty.call(catalog,id))h+='<div class="option" data-add="'+id+'"><span>'+catalog[id].name+'</span><span>'+(order.indexOf(id)>=0?'✓':'＋')+'</span></div>';l.innerHTML=h;var a=l.querySelectorAll('[data-add]');for(var i=0;i<a.length;i++)a[i].onclick=function(){var id=this.getAttribute('data-add');if(order.indexOf(id)<0){order.push(id);save();render()}$('#addSheet').classList.remove('open')}}
function openConfig(id){currentConfig=id;$('#configTitle').textContent=catalog[id].name;var b=$('#configBody');if(id==='seastate')b.innerHTML='<div class="option"><span>Factor de ola</span><input id="seaFactor" class="field" type="number" step="0.05" value="'+seaFactor+'"></div>';else if(id==='batteries')b.innerHTML=batteryConfigHtml();else b.innerHTML='<div class="sub">Sin ajustes adicionales por ahora.</div>';$('#configSheet').classList.add('open');setTimeout(function(){var f=$('#seaFactor');if(f)f.onchange=function(){seaFactor=Math.max(0,Number(f.value)||0);save();recalcSea(true)};bindBatteryConfig()},0)}
function batteryConfigHtml(){var banks=vals(state.banks),h='<div class="option"><span>Bancos</span><button class="btn" id="addBank">＋ Agregar banco</button></div><div class="sub">Primero creá un banco. Las baterías se agregan entrando a configurar ese banco.</div>';if(!banks.length)return h+'<div class="bank"><div class="sub">Todavía no hay bancos.</div></div>';for(var i=0;i<banks.length;i++){var b=banks[i],s=bankStats(b.id);h+='<div class="bank"><div class="bank-head"><span class="name">'+esc(b.name)+'</span><span class="status">'+s.total+' batería'+(s.total===1?'':'s')+'</span><button class="more" data-bankmore="'+b.id+'">⋯</button></div><div class="bank-soc">'+(s.soc==null?'—%':s.soc.toFixed(0)+'%')+'</div></div>'}return h}
function bankEditor(id){var b=state.banks[id],list=batteriesForBank(id),h='<div class="backrow"><button class="btn" id="backBanks">‹ Bancos</button><b>'+esc(b?b.name:'Banco')+'</b></div><div class="option"><span>Nombre</span><input id="bankName" class="field" value="'+esc(b?b.name:'Banco')+'"></div><div class="option"><button class="btn" id="saveBank">Guardar banco</button><button class="btn" id="addBattery">＋ Agregar batería</button></div>';var s=bankStats(id);h+='<div class="bank"><div class="bank-soc">'+(s.soc==null?'—%':s.soc.toFixed(0)+'%')+'</div><div class="sub">'+s.connected+'/'+s.total+' conectadas'+(s.cap?' · '+s.cap.toFixed(0)+' Ah':'')+'</div></div>';for(var i=0;i<list.length;i++){var bt=list[i];h+='<div class="battery-card"><div class="battery-top"><span class="name">'+esc(bt.name)+'</span><span class="status '+(bt.connected?'ok':'')+'">'+(isFinite(Number(bt.soc))?Number(bt.soc).toFixed(0)+'%':bt.connected?'Conectada':'Desconectada')+'</span><button class="more" data-bmore="'+bt.id+'">⋯</button></div></div>'}if(!list.length)h+='<div class="sub">Sin baterías en este banco.</div>';h+='<div class="option"><button class="btn danger" id="deleteBank">Eliminar banco</button></div>';$('#configBody').innerHTML=h;$('#backBanks').onclick=function(){openConfig('batteries')};$('#saveBank').onclick=function(){if(window.NativeBridge){NativeBridge.updateBank(id,$('#bankName').value);toast('Banco guardado');setTimeout(function(){loadAll();bankEditor(id)},200)}};$('#addBattery').onclick=function(){editBattery(null,id)};$('#deleteBank').onclick=function(){if(window.NativeBridge){var ok=NativeBridge.deleteBank(id);toast(ok?'Banco eliminado':'El banco tiene baterías');if(ok)setTimeout(function(){loadAll();openConfig('batteries')},200)}};var ms=document.querySelectorAll('[data-bmore]');for(i=0;i<ms.length;i++)ms[i].onclick=function(){editBattery(Number(this.getAttribute('data-bmore')),id)}}
function bindBatteryConfig(){var a=$('#addBank');if(a)a.onclick=function(){editBank(null)};var ms=document.querySelectorAll('[data-bankmore]');for(var i=0;i<ms.length;i++)ms[i].onclick=function(){bankEditor(Number(this.getAttribute('data-bankmore')))}}
function editBank(id){var current=vals(state.banks).length+1,b=id!=null?state.banks[id]:null;$('#configBody').innerHTML='<div class="backrow"><button class="btn" id="backBanks">‹ Bancos</button><b>'+(b?'Configurar banco':'Crear banco')+'</b></div><div class="option"><span>Nombre</span><input id="bankName" class="field" value="'+esc(b?b.name:'Banco '+current)+'"></div><div class="option"><button class="btn" id="saveBank">Guardar</button></div>';$('#backBanks').onclick=function(){openConfig('batteries')};$('#saveBank').onclick=function(){if(!window.NativeBridge)return;var name=$('#bankName').value;if(b){NativeBridge.updateBank(id,name);toast('Banco guardado');setTimeout(function(){loadAll();bankEditor(id)},200)}else{var nid=NativeBridge.addBank(name);toast('Banco creado');setTimeout(function(){loadAll();bankEditor(Number(nid))},250)}}}
function editBattery(id,bankId){var b=id!=null?state.batteries[id]:null;if(b)bankId=Number(b.bankId);var list=batteriesForBank(bankId),count=list.length+1;$('#configBody').innerHTML='<div class="backrow"><button class="btn" id="backBank">‹ Banco</button><b>'+(b?'Configurar batería':'Agregar batería')+'</b></div><div class="option"><span>Nombre</span><input id="bName" class="field" value="'+esc(b?b.name:'Batería '+count)+'"></div><div class="option"><span>Capacidad Ah<br><small>0 = detectar desde BMS</small></span><input id="bCap" class="field" type="number" min="0" value="'+(b&&b.capacityAh?b.capacityAh:0)+'"></div><div class="option"><span>Tipo de BMS</span><select id="bBms" class="select"><option value="auto">Automático</option><option value="humsienk">Humsienk</option><option value="other">Otro / no compatible</option></select></div>'+(b?'<div class="option"><span>Bluetooth<br><small>'+esc(b.address||'No vinculado')+'</small></span><button class="btn" id="scanBattery">'+(b.address?'Cambiar':'Vincular')+'</button></div>':'')+'<div class="option"><button class="btn" id="saveBattery">Guardar</button>'+(b?'<button class="btn danger" id="deleteBattery">Eliminar</button>':'')+'</div><div id="scanArea"></div>';$('#bBms').value=b&&b.bmsType?b.bmsType:'auto';$('#backBank').onclick=function(){bankEditor(bankId)};$('#saveBattery').onclick=function(){if(!window.NativeBridge)return;var name=$('#bName').value,cap=Number($('#bCap').value)||0,bms=$('#bBms').value;if(b){NativeBridge.updateBattery(id,bankId,name,cap,bms);toast('Batería guardada');setTimeout(function(){loadAll();bankEditor(bankId)},250)}else{var nid=NativeBridge.addBattery(bankId,name,cap,bms);toast('Batería creada');setTimeout(function(){loadAll();editBattery(Number(nid),bankId)},250)}};var s=$('#scanBattery');if(s)s.onclick=function(){startScan(id)};var d=$('#deleteBattery');if(d)d.onclick=function(){if(window.NativeBridge){NativeBridge.deleteBattery(id);delete state.batteries[id];toast('Batería eliminada');setTimeout(function(){loadAll();bankEditor(bankId)},200)}}}
function startScan(id){currentBatteryId=id;scanResults={};$('#scanArea').innerHTML='<div class="sub">Buscando dispositivos BLE…</div>';if(window.NativeBridge)NativeBridge.startBatteryScan()}
function renderScan(){var a=$('#scanArea');if(!a)return;var rows=vals(scanResults);rows.sort(function(x,y){return y.rssi-x.rssi});var h='';for(var i=0;i<rows.length;i++){var d=rows[i];h+='<div class="scan-item"><span><b>'+esc(d.name||'BLE sin nombre')+'</b><br><small>'+esc(d.address)+' · '+d.rssi+' dBm</small></span><button class="btn" data-pick="'+d.address+'">Usar</button></div>'}a.innerHTML=h;var ps=a.querySelectorAll('[data-pick]');for(i=0;i<ps.length;i++)ps[i].onclick=function(){if(window.NativeBridge){NativeBridge.setBatteryAddress(currentBatteryId,this.getAttribute('data-pick'));toast('Bluetooth vinculado');setTimeout(loadAll,500)}}}
function loadAll(){try{var ba=window.NativeBridge?JSON.parse(NativeBridge.getSavedBanks()||'[]'):[],bt=window.NativeBridge?JSON.parse(NativeBridge.getSavedBatteries()||'[]'):[],nb={},nbt={},i;for(i=0;i<ba.length;i++)nb[ba[i].id]=ba[i];state.banks=nb;for(i=0;i<bt.length;i++){var old=state.batteries[bt[i].id]||{},merged={},k;for(k in old)if(Object.prototype.hasOwnProperty.call(old,k))merged[k]=old[k];for(k in bt[i])if(Object.prototype.hasOwnProperty.call(bt[i],k))merged[k]=bt[i][k];nbt[bt[i].id]=merged}state.batteries=nbt;applyLive()}catch(e){toast('Error cargando configuración')}}
function sheet(id,btn){$(btn).onclick=function(){$(id).classList.add('open')};$(id).onclick=function(e){if(e.target===$(id))$(id).classList.remove('open')}}sheet('#addSheet','#addBtn');sheet('#menuSheet','#menuBtn');$('#configSheet').onclick=function(e){if(e.target===$('#configSheet'))$('#configSheet').classList.remove('open')};$('#removeCard').onclick=function(){if(currentConfig){var out=[];for(var i=0;i<order.length;i++)if(order[i]!==currentConfig)out.push(order[i]);order=out;save();$('#configSheet').classList.remove('open');render()}};
window.BoatStation={updateGPS:function(o){state.gps=o;applyLive()},updatePhone:function(o){state.phone=o;applyLive()},updateCompass:function(h){state.heading=Number(h)||0;applyLive()},updateMotion:function(m){state.motion=Number(m)||0;motionSamples.push({t:Date.now(),v:state.motion});recalcSea(false)},onBleScanResult:function(o){scanResults[o.address]=o;renderScan()},onBatteryConnection:function(o){var b=state.batteries[o.id]||{},k;for(k in o)b[k]=o[k];state.batteries[o.id]=b;applyLive()},onBatteryData:function(o){var b=state.batteries[o.id]||{},k;for(k in o)b[k]=o[k];state.batteries[o.id]=b;applyLive()},onBatteryServices:function(){},onBatteryRaw:function(){}};
try{render();setTimeout(loadAll,500);setInterval(function(){recalcSea(true)},5000)}catch(e){cards.innerHTML='<div class="bank"><b>Error al iniciar la interfaz</b><div class="sub">'+esc(e&&e.message?e.message:String(e))+'</div></div>'}
})();
</script></body></html>
