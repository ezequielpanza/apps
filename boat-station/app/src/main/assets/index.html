<!doctype html>
<html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>Boat Station</title>
<style>
:root{--bg:#061522;--card:#0b2335;--card2:#0e2b40;--text:#f4f8fb;--muted:#94a7b6;--line:#17394f;--accent:#1ed7e5;--ok:#8bd332;--bad:#ff6e6e;--shadow:0 10px 28px rgba(0,0,0,.32)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);overscroll-behavior:none}.app{min-height:100vh;background:radial-gradient(circle at 70% -10%,#0d3450 0,#071c2d 34%,#061522 70%)}.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px;background:rgba(6,21,34,.96);border-bottom:1px solid #103248}.brand{display:flex;align-items:center;gap:8px;font-weight:850;letter-spacing:.05em}.brand b{color:var(--accent)}.brandmark{width:28px;height:28px;border-radius:9px;border:1px solid #1d526a;display:grid;place-items:center;color:var(--accent);background:#0a2639}.iconbtn{width:40px;height:40px;border:0;border-radius:12px;background:#0b2639;color:#fff;font-size:22px}.content{padding:14px 12px 90px}.empty{display:none;text-align:center;padding:70px 30px;color:var(--muted)}.card{position:relative;background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);margin-bottom:11px;overflow:hidden;transform-style:preserve-3d;transition:transform .18s,opacity .18s}.card.dragging{opacity:.92;transform:scale(1.02);z-index:100}.card.drop-before:before{content:"";position:absolute;left:10px;right:10px;top:0;height:3px;background:var(--accent);z-index:150}.card-head{height:50px;display:flex;align-items:center;gap:8px;padding:9px 11px;user-select:none}.drag{font-size:17px;color:#718797;padding:7px 4px;touch-action:none}.sensor-dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}.title-toggle{display:flex;align-items:center;gap:5px;flex:1;min-width:0}.chev{width:12px;color:#8698a5;font-size:11px;transition:.18s}.card.collapsed .chev{transform:rotate(-90deg)}.title{font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.summary{font-size:12px;color:var(--muted);white-space:nowrap;max-width:43%;overflow:hidden;text-overflow:ellipsis}.more{border:0;background:transparent;font-size:21px;color:#d8e3e9}.card-body{height:176px;padding:4px 14px 14px;overflow:hidden;transition:height .2s,padding .2s,opacity .15s;perspective:900px}.card.collapsed .card-body{height:0;padding-top:0;padding-bottom:0;opacity:0}.view{display:none;height:100%}.view.active{display:block}.big{font-size:39px;font-weight:850;letter-spacing:-1.2px;margin:2px 0}.sub{font-size:14px;color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{background:#113148;border:1px solid #173d55;border-radius:10px;padding:8px 10px;font-size:13px}.pager{text-align:center;color:#617b8d;font-size:12px;letter-spacing:3px;margin-top:13px}.pager .on{color:var(--accent)}.circle{width:94px;height:94px;border-radius:50%;border:8px solid #16384a;border-top-color:var(--ok);display:grid;place-items:center;margin:3px auto;font-size:24px;font-weight:800}.center{text-align:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.metric{background:#113148;border:1px solid #173d55;border-radius:11px;padding:9px}.metric small{display:block;color:var(--muted);font-size:11px}.metric b{display:block;margin-top:2px;font-size:16px}.battery-slot{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.status{font-size:11px;padding:4px 7px;border-radius:20px;background:#143348;color:var(--muted)}.status.ok{color:#c9f59b;border:1px solid #365825}.status.off{color:#ffb2b2;border:1px solid #683030}.btn{border:1px solid #24516a;background:#102f45;color:#fff;border-radius:10px;padding:9px 11px}.sheet{position:fixed;inset:0;background:rgba(0,8,14,.56);display:none;align-items:flex-end;z-index:300;touch-action:none}.sheet.open{display:flex}.sheet-inner{width:100%;background:#0b2335;border:1px solid #17394f;border-bottom:0;border-radius:24px 24px 0 0;padding:17px 16px calc(26px + env(safe-area-inset-bottom));height:min(82dvh,760px);max-height:calc(100dvh - 18px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;box-shadow:0 -18px 50px rgba(0,0,0,.4)}.handle{width:44px;height:5px;background:#315064;border-radius:99px;margin:0 auto 16px;touch-action:none}.sheet h3{margin:0 0 10px}.option{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 3px;border-bottom:1px solid var(--line);min-height:50px}.option small{color:var(--muted)}.option.disabled{opacity:.42}.danger{color:var(--bad)}.field{width:110px;background:#071827;color:#fff;border:1px solid #24516a;border-radius:9px;padding:9px;text-align:right}.select{background:#071827;color:#fff;border:1px solid #24516a;border-radius:9px;padding:9px}.footer{position:fixed;bottom:12px;left:0;right:0;text-align:center;pointer-events:none;z-index:45}.hint{display:inline-block;background:rgba(6,21,34,.93);border:1px solid #17394f;color:#c5d4dd;padding:8px 12px;border-radius:999px;font-size:10.5px}.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-12px);background:#102e43;color:#fff;border:1px solid #1c536d;border-radius:12px;padding:10px 13px;font-size:12px;opacity:0;transition:.18s;z-index:400}.toast.show{opacity:.98;transform:translateX(-50%) translateY(0)}.scan-list{margin-top:10px}.scan-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.diag{margin:10px 0 18px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#071827}.diag-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.diag-service{font-size:11px;color:#c6d3dc;margin:8px 0 3px;word-break:break-all}.diag-char{font-size:10px;color:var(--muted);padding:4px 0;word-break:break-all}.raw{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.35;word-break:break-all;padding:6px 0;border-top:1px solid #123148}.raw b{color:var(--accent)}body.light{--bg:#f5f7fa;--card:#fff;--card2:#fff;--text:#17202a;--muted:#6b7785;--line:#e5e9ef;--shadow:0 8px 22px rgba(20,32,50,.08)}.light .app{background:linear-gradient(#fbfcfe,#f5f7fa)}.light .topbar{background:#fbfcfe;border-color:#e5e9ef}.light .iconbtn{background:#fff;color:#0b2239}.light .pill,.light .metric{background:#f3f6f8;border-color:#edf1f4}.light .sheet-inner{background:#fff}.light .field,.light .select,.light .diag{background:#f5f7fa;color:#17202a}.card.flip-out-left{animation:outL .16s forwards}.card.flip-in-right{animation:inR .19s forwards}.card.flip-out-right{animation:outR .16s forwards}.card.flip-in-left{animation:inL .19s forwards}@keyframes outL{to{transform:perspective(850px) rotateY(-82deg);opacity:.45}}@keyframes inR{from{transform:perspective(850px) rotateY(82deg);opacity:.45}to{transform:rotateY(0);opacity:1}}@keyframes outR{to{transform:perspective(850px) rotateY(82deg);opacity:.45}}@keyframes inL{from{transform:perspective(850px) rotateY(-82deg);opacity:.45}to{transform:rotateY(0);opacity:1}}
</style></head><body>
<div class="app"><div class="topbar"><button class="iconbtn" id="menuBtn">☰</button><div class="brand"><span class="brandmark">⌁</span>BOAT <b>STATION</b></div><button class="iconbtn" id="addBtn">＋</button></div><div class="content" id="cards"></div><div class="empty" id="empty">No hay tarjetas. Tocá + para agregar sensores.</div></div>
<div class="footer"><span class="hint">Título: minimizar/restaurar · ⋮⋮ arrastrar · swipe: cambiar vista</span></div><div class="toast" id="toast"></div>
<div class="sheet" id="addSheet"><div class="sheet-inner"><div class="handle"></div><h3>Agregar tarjeta</h3><div id="sensorList"></div></div></div>
<div class="sheet" id="menuSheet"><div class="sheet-inner"><div class="handle"></div><h3>Boat Station</h3><div class="option" id="themeRow"><span>Apariencia</span><small id="themeText">Oscura</small></div><div class="option"><span>Unidades</span><small>Nudos · °C · m</small></div><div class="option"><span>Versión</span><small>0.0.7</small></div></div></div>
<div class="sheet" id="configSheet"><div class="sheet-inner"><div class="handle"></div><h3 id="configTitle">Sensor</h3><div id="configBody"></div><div class="option danger" id="removeCard"><span>Quitar tarjeta</span><span>×</span></div></div></div>
<script>
const catalog={gps:{name:'GPS',source:'Este teléfono'},phone:{name:'Estado del teléfono',source:'Este teléfono'},seastate:{name:'Sea State',source:'Calculado · sensores del teléfono'},batteries:{name:'Baterías',source:'Banco · Bluetooth BLE'},compass:{name:'Brújula',source:'Este teléfono'},motion:{name:'Movimiento',source:'Este teléfono'},victron:{name:'Victron SmartSolar MPPT',source:'Bluetooth · conector pendiente',disabled:true},nmea:{name:'NMEA / Zeus',source:'Wi‑Fi · conector pendiente',disabled:true}};
const defaults=['gps','phone','seastate'];
let order=(JSON.parse(localStorage.getItem('bs.order')||'null')||defaults).filter(x=>x!=='gateway'&&x!=='humsienk');if(!order.length)order=[...defaults];let collapsed=JSON.parse(localStorage.getItem('bs.collapsed')||'{}'),views=JSON.parse(localStorage.getItem('bs.views')||'{}');let gpsFormat=localStorage.getItem('bs.gpsFormat')||'dd',seaFactor=parseFloat(localStorage.getItem('bs.seaFactor')||'1')||1;let currentConfig=null,state={gps:null,phone:null,heading:0,motion:0,seaAvg:0,seaPeak:0,wave:0,batteries:{1:{slot:1,name:'Batería 1',address:'',capacityAh:300,connected:false},2:{slot:2,name:'Batería 2',address:'',capacityAh:300,connected:false}}};let motionSamples=[],lastSeaUpdate=0,scanResults={},batteryDiag={1:{services:[],raw:[]},2:{services:[],raw:[]}};
const cards=document.getElementById('cards'),empty=document.getElementById('empty'),addSheet=document.getElementById('addSheet'),menuSheet=document.getElementById('menuSheet'),configSheet=document.getElementById('configSheet');
function save(){localStorage.setItem('bs.order',JSON.stringify(order));localStorage.setItem('bs.collapsed',JSON.stringify(collapsed));localStorage.setItem('bs.views',JSON.stringify(views));localStorage.setItem('bs.gpsFormat',gpsFormat);localStorage.setItem('bs.seaFactor',seaFactor)}function dots(n,idx){return `<div class="pager">${Array.from({length:n},(_,i)=>`<span class="${i===idx?'on':''}">${i===idx?'●':'○'}</span>`).join(' ')}</div>`}function fmtCoord(v,isLat){let a=Math.abs(v),hem=isLat?(v>=0?'N':'S'):(v>=0?'E':'W');if(gpsFormat==='dd')return `${v.toFixed(6)}°`;let d=Math.floor(a),m=(a-d)*60;if(gpsFormat==='dm')return `${d}° ${m.toFixed(3)}' ${hem}`;let mi=Math.floor(m),s=(m-mi)*60;return `${d}° ${mi}' ${s.toFixed(1)}\" ${hem}`}function waveText(){return state.wave.toFixed(2)+' m'}function seaLabel(){let x=state.seaAvg;return x<.18?'Calmo':x<.45?'Suave':x<.85?'Moderado':x<1.5?'Movido':'Fuerte'}function batteryBankSummary(){let c=Object.values(state.batteries).filter(x=>x.connected).length;return c?`${c}/2 conectadas`:'Sin conectar'}
function bodyFor(id){let idx=views[id]||0;if(id==='gps')return `<div class="view"><div class="big" style="font-size:29px" data-gps-lat>Esperando GPS…</div><div class="big" style="font-size:29px" data-gps-lon>—</div><div class="row"><span class="pill" data-gps-acc>Precisión —</span></div>${dots(3,idx)}</div><div class="view"><div class="big" data-gps-speed>0.0 kn</div><div class="sub" data-gps-bearing>Rumbo —</div><div class="row"><span class="pill" data-gps-alt>Altitud —</span></div>${dots(3,idx)}</div><div class="view"><div class="grid2"><div class="metric"><small>Latitud</small><b data-gps-all-lat>—</b></div><div class="metric"><small>Longitud</small><b data-gps-all-lon>—</b></div><div class="metric"><small>Velocidad</small><b data-gps-all-speed>—</b></div><div class="metric"><small>Rumbo</small><b data-gps-all-bearing>—</b></div></div>${dots(3,idx)}</div>`;if(id==='phone')return `<div class="view"><div class="circle" data-phone-bat>—%</div><div class="center sub" data-phone-charge>Estado de batería</div><div class="row"><span class="pill" data-phone-temp>—°C</span><span class="pill" data-phone-net>—</span></div>${dots(2,idx)}</div><div class="view"><div class="big" data-phone-time>—</div><div class="sub" data-phone-time-label>Tiempo estimado</div><div class="row"><span class="pill" data-phone-model>Android</span></div>${dots(2,idx)}</div>`;if(id==='seastate')return `<div class="view"><div class="big" data-wave-main>0.00 m</div><div class="sub">Altura de ola estimada</div><div class="row"><span class="pill">Promedio últimos 30 s</span><span class="pill" data-sea-label>Calmo</span></div><div class="row"><span class="pill" data-sea-value>Movimiento 0.00 m/s²</span><span class="pill" data-sea-peak>Pico 0.00</span></div></div>`;if(id==='batteries')return `<div class="view"><div class="big" data-bank-soc>—%</div><div class="sub">Banco House · 600 Ah nominales</div><div class="row"><span class="pill" data-bank-connect>Sin conectar</span><span class="pill">Lectura BMS en diagnóstico</span></div>${dots(2,idx)}</div><div class="view"><div class="battery-slot"><span><b data-b1-name>Batería 1</b><br><small data-b1-address>No configurada</small></span><span class="status off" data-b1-status>Desconectada</span></div><div class="battery-slot"><span><b data-b2-name>Batería 2</b><br><small data-b2-address>No configurada</small></span><span class="status off" data-b2-status>Desconectada</span></div>${dots(2,idx)}</div>`;if(id==='compass')return `<div class="view"><div class="big center" data-heading>—°</div><div class="sub center">Rumbo magnético</div></div>`;if(id==='motion')return `<div class="view"><div class="big" data-motion>0.00</div><div class="sub">Aceleración dinámica aproximada (m/s²)</div></div>`;return ''}
function summary(id){if(id==='gps'&&state.gps)return fmtCoord(state.gps.lat,true)+' · '+fmtCoord(state.gps.lon,false);if(id==='phone'&&state.phone)return state.phone.battery+'% · '+(state.phone.charging?'cargando':state.phone.network);if(id==='seastate')return waveText();if(id==='batteries')return batteryBankSummary();if(id==='compass')return Math.round(state.heading)+'°';if(id==='motion')return state.motion.toFixed(2)+' m/s²';return 'Activo'}function cardHTML(id){return `<section class="card ${collapsed[id]?'collapsed':''}" data-id="${id}"><div class="card-head"><span class="drag">⋮⋮</span><span class="sensor-dot"></span><div class="title-toggle"><span class="chev">▾</span><span class="title">${catalog[id].name}</span></div><span class="summary" data-summary>${summary(id)}</span><button class="more">⋯</button></div><div class="card-body">${bodyFor(id)}</div></section>`}function setView(card,id){let all=[...card.querySelectorAll('.view')],idx=Math.min(views[id]||0,Math.max(0,all.length-1));all.forEach((v,i)=>v.classList.toggle('active',i===idx));updatePager(card,idx)}function updatePager(card,idx){card.querySelectorAll('.pager').forEach(p=>p.querySelectorAll('span').forEach((s,i)=>{s.classList.toggle('on',i===idx);s.textContent=i===idx?'●':'○'}))}
function render(){let visible=order.filter(id=>catalog[id]&&!catalog[id].disabled);cards.innerHTML=visible.map(cardHTML).join('');empty.style.display=visible.length?'none':'block';cards.querySelectorAll('.card').forEach(c=>setView(c,c.dataset.id));bindCards();applyLive();renderSensorList()}function bindCards(){document.querySelectorAll('.title-toggle').forEach(el=>el.onclick=()=>{let c=el.closest('.card'),id=c.dataset.id;c.classList.toggle('collapsed');collapsed[id]=c.classList.contains('collapsed');save()});document.querySelectorAll('.more').forEach(el=>el.onclick=e=>{e.stopPropagation();currentConfig=el.closest('.card').dataset.id;openConfig(currentConfig)});document.querySelectorAll('.card-body').forEach(body=>{let sx=0,sy=0;body.addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});body.addEventListener('touchend',e=>{if(!e.changedTouches.length)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy)*1.25)cycleView(body.closest('.card').dataset.id,dx<0?1:-1)},{passive:true})});bindDrag()}function cycleView(id,dir){let c=document.querySelector(`.card[data-id="${id}"]`),all=c?[...c.querySelectorAll('.view')]:[];if(!c||all.length<2||c.dataset.flipping==='1')return;let cur=all.findIndex(v=>v.classList.contains('active')),next=(cur+dir+all.length)%all.length;c.dataset.flipping='1';let out=dir>0?'flip-out-left':'flip-out-right',inn=dir>0?'flip-in-right':'flip-in-left';c.classList.add(out);setTimeout(()=>{all.forEach((v,i)=>v.classList.toggle('active',i===next));views[id]=next;save();updatePager(c,next);c.classList.remove(out);c.classList.add(inn);setTimeout(()=>{c.classList.remove(inn);c.dataset.flipping='0'},195)},155)}function bindDrag(){document.querySelectorAll('.drag').forEach(h=>{let c=null,t=null,active=false;const end=()=>{clearTimeout(t);if(active&&c){order=[...cards.querySelectorAll('.card')].map(x=>x.dataset.id);save();showToast('Orden guardado')}document.querySelectorAll('.card').forEach(x=>x.classList.remove('dragging','drop-before'));active=false;c=null};h.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;c=h.closest('.card');t=setTimeout(()=>{active=true;c.classList.add('dragging');navigator.vibrate&&navigator.vibrate(20)},250)},{passive:true});h.addEventListener('touchmove',e=>{if(!active||e.touches.length!==1)return;e.preventDefault();let y=e.touches[0].clientY,others=[...cards.querySelectorAll('.card:not(.dragging)')],target=others.find(x=>y<x.getBoundingClientRect().top+x.offsetHeight/2);document.querySelectorAll('.card').forEach(x=>x.classList.remove('drop-before'));if(target){target.classList.add('drop-before');cards.insertBefore(c,target)}else cards.appendChild(c)},{passive:false});h.addEventListener('touchend',end);h.addEventListener('touchcancel',end)})}
function renderSensorList(){let list=document.getElementById('sensorList');list.innerHTML=Object.entries(catalog).map(([id,c])=>`<div class="option ${c.disabled?'disabled':''}" data-add="${id}"><span>${c.name}<br><small>${c.source}</small></span><span>${c.disabled?'Próximamente':order.includes(id)?'✓':'＋'}</span></div>`).join('');list.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>{let id=el.dataset.add;if(catalog[id].disabled)return showToast('Conector en desarrollo');if(!order.includes(id)){order.push(id);save();render()}addSheet.classList.remove('open')})}
function openConfig(id){document.getElementById('configTitle').textContent=catalog[id].name;let b=document.getElementById('configBody');if(id==='gps')b.innerHTML=`<div class="option"><span>Formato de coordenadas</span><select class="select" id="gpsFmt"><option value="dd">DD.dddddd°</option><option value="dm">DD° MM.mmm'</option><option value="dms">DD° MM' SS.s\"</option></select></div>`;else if(id==='seastate')b.innerHTML=`<div class="option"><span>Factor de ola<br><small>Altura estimada = movimiento medio × factor</small></span><input class="field" id="seaFactor" type="number" min="0" step="0.05" value="${seaFactor}"></div><div class="option"><span>Ventana</span><small>30 segundos</small></div><div class="option"><span>Actualización</span><small>Cada 5 segundos</small></div>`;else if(id==='batteries')b.innerHTML=batteryConfigHtml();else b.innerHTML=`<div class="option"><span>Frecuencia</span><small>Automática</small></div>`;configSheet.classList.add('open');setTimeout(()=>{let f=document.getElementById('gpsFmt');if(f){f.value=gpsFormat;f.onchange=()=>{gpsFormat=f.value;save();render();openConfig('gps')}}let sf=document.getElementById('seaFactor');if(sf)sf.onchange=()=>{seaFactor=Math.max(0,parseFloat(sf.value)||0);save();recalcSea(true);applyLive()};bindBatteryConfig()},0)}
function batteryConfigHtml(){return `<div class="option"><span>Banco</span><small>House · 2 × 300 Ah</small></div>${[1,2].map(slot=>{let x=state.batteries[slot];return `<div class="option"><span><b>Batería ${slot}</b><br><small>${x.address?`${escapeHtml(x.name)} · ${x.address}`:'No configurada'}</small></span><button class="btn" data-slot-scan="${slot}">${x.address?'Cambiar':'Vincular'}</button></div>`}).join('')}<div class="option"><span>Conexión automática</span><small>Activada</small></div><h3 style="margin-top:18px">Diagnóstico BMS</h3><div class="sub">Boat Station enumera servicios/characteristics, se suscribe a NOTIFY/INDICATE y muestra datos crudos. Esto nos permitirá identificar el protocolo Humsienk.</div><div id="diagArea">${diagHtml()}</div><div id="scanArea" class="scan-list"></div>`}
function diagHtml(){return [1,2].map(slot=>{let d=batteryDiag[slot],x=state.batteries[slot],services=d.services||[],raw=d.raw||[];return `<div class="diag"><div class="diag-title"><span><b>Batería ${slot}</b> · ${x.connected?'Conectada':'Desconectada'}</span><button class="btn" data-read-diag="${slot}">Leer</button></div>${services.length?services.map(s=>`<div class="diag-service">Servicio ${escapeHtml(s.uuid||String(s))}</div>${(s.characteristics||[]).map(c=>`<div class="diag-char">↳ ${escapeHtml(c.uuid)} · ${escapeHtml(c.properties||'')}</div>`).join('')}`).join(''):'<div class="sub">Esperando descubrimiento de servicios…</div>'}<div style="margin-top:8px"><b style="font-size:12px">Datos raw recientes</b>${raw.length?raw.slice(-12).reverse().map(r=>`<div class="raw"><b>${escapeHtml(r.source)}</b> ${escapeHtml(r.characteristic)}<br>${escapeHtml(r.hex||'(vacío)')}</div>`).join(''):'<div class="sub" style="margin-top:5px">Sin paquetes recibidos todavía.</div>'}</div></div>`}).join('')}
function bindBatteryConfig(){document.querySelectorAll('[data-slot-scan]').forEach(btn=>btn.onclick=()=>{let slot=Number(btn.dataset.slotScan);window.__batterySlot=slot;scanResults={};document.getElementById('scanArea').innerHTML='<div class="sub">Buscando dispositivos BLE cercanos…</div>';if(window.NativeBridge&&NativeBridge.startBatteryScan)NativeBridge.startBatteryScan();else showToast('BLE nativo no disponible')});bindDiagButtons()}function bindDiagButtons(){document.querySelectorAll('[data-read-diag]').forEach(btn=>btn.onclick=()=>{let slot=Number(btn.dataset.readDiag);if(window.NativeBridge&&NativeBridge.readBatteryDiagnostics){NativeBridge.readBatteryDiagnostics(slot);showToast(`Leyendo batería ${slot}`)}})}function refreshDiagArea(){let a=document.getElementById('diagArea');if(a){a.innerHTML=diagHtml();bindDiagButtons()}}
function renderScan(){let area=document.getElementById('scanArea');if(!area)return;let rows=Object.values(scanResults).sort((a,b)=>b.rssi-a.rssi);area.innerHTML=rows.length?rows.map(d=>`<div class="scan-item"><span><b>${escapeHtml(d.name||'BLE sin nombre')}</b><br><small>${d.address} · ${d.rssi} dBm</small></span><button class="btn" data-pick="${d.address}">Usar</button></div>`).join(''):'<div class="sub">Sin resultados todavía…</div>';area.querySelectorAll('[data-pick]').forEach(btn=>btn.onclick=()=>{let d=scanResults[btn.dataset.pick],slot=window.__batterySlot||1;if(window.NativeBridge&&NativeBridge.saveBattery){NativeBridge.saveBattery(slot,d.address,d.name||`Batería ${slot}`,300);showToast(`Batería ${slot} guardada`);setTimeout(loadSavedBatteries,250)}})}function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function loadSavedBatteries(){try{if(window.NativeBridge&&NativeBridge.getSavedBatteries){let arr=JSON.parse(NativeBridge.getSavedBatteries()||'[]');arr.forEach(x=>{state.batteries[x.slot]={...state.batteries[x.slot],...x}});applyLive();if(currentConfig==='batteries')openConfig('batteries')}}catch(e){}}
function applyLive(){document.querySelectorAll('[data-summary]').forEach(x=>x.textContent=summary(x.closest('.card').dataset.id));if(state.gps){set('[data-gps-lat]',fmtCoord(state.gps.lat,true));set('[data-gps-lon]',fmtCoord(state.gps.lon,false));set('[data-gps-acc]','Precisión '+Math.round(state.gps.accuracy)+' m');set('[data-gps-speed]',state.gps.speedKts.toFixed(1)+' kn');set('[data-gps-bearing]','Rumbo '+Math.round(state.gps.bearing)+'°');set('[data-gps-alt]','Altitud '+Math.round(state.gps.altitude)+' m');set('[data-gps-all-lat]',fmtCoord(state.gps.lat,true));set('[data-gps-all-lon]',fmtCoord(state.gps.lon,false));set('[data-gps-all-speed]',state.gps.speedKts.toFixed(1)+' kn');set('[data-gps-all-bearing]',Math.round(state.gps.bearing)+'°')}if(state.phone){set('[data-phone-bat]',state.phone.battery+'%');set('[data-phone-charge]',state.phone.charging?'Cargando':'Usando batería');set('[data-phone-temp]',state.phone.batteryTemp.toFixed(1)+'°C');set('[data-phone-net]',state.phone.network||'—');set('[data-phone-model]',state.phone.model||'Android');let ms=Number(state.phone.chargeTimeMs)||0;if(state.phone.charging&&ms>0){set('[data-phone-time]',duration(ms));set('[data-phone-time-label]','Hasta carga completa')}else{set('[data-phone-time]','—');set('[data-phone-time-label]',state.phone.charging?'Calculando carga':'Autonomía no disponible')}}set('[data-heading]',Math.round(state.heading)+'°');set('[data-motion]',state.motion.toFixed(2));set('[data-wave-main]',waveText());set('[data-sea-label]',seaLabel());set('[data-sea-value]','Movimiento '+state.seaAvg.toFixed(2)+' m/s²');set('[data-sea-peak]','Pico '+state.seaPeak.toFixed(2));set('[data-bank-connect]',batteryBankSummary());[1,2].forEach(slot=>{let x=state.batteries[slot];set(`[data-b${slot}-name]`,x.name||`Batería ${slot}`);set(`[data-b${slot}-address]`,x.address||'No configurada');let el=document.querySelector(`[data-b${slot}-status]`);if(el){el.textContent=x.connected?'Conectada':(x.address?'Desconectada':'No configurada');el.classList.toggle('ok',!!x.connected);el.classList.toggle('off',!x.connected)}})}function recalcSea(force=false){let now=Date.now();motionSamples=motionSamples.filter(s=>now-s.t<=30000);if(!motionSamples.length){state.seaAvg=0;state.seaPeak=0;state.wave=0;return}if(!force&&now-lastSeaUpdate<5000)return;lastSeaUpdate=now;state.seaAvg=motionSamples.reduce((a,s)=>a+s.v,0)/motionSamples.length;state.seaPeak=Math.max(...motionSamples.map(s=>s.v));state.wave=state.seaAvg*seaFactor;applyLive()}function duration(ms){let min=Math.max(1,Math.round(ms/60000)),h=Math.floor(min/60),m=min%60;return h?(h+' h '+m+' min'):(m+' min')}function set(q,v){let el=document.querySelector(q);if(el)el.textContent=v}function showToast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>e.classList.remove('show'),1500)}
function bindSheets(){document.querySelectorAll('.sheet').forEach(sheet=>{sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open')};let inner=sheet.querySelector('.sheet-inner'),h=sheet.querySelector('.handle');let sy=0,ly=0,st=0,drag=false;h.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sy=ly=e.touches[0].clientY;st=Date.now();drag=true;inner.style.transition='none'},{passive:true});h.addEventListener('touchmove',e=>{if(!drag)return;ly=e.touches[0].clientY;let dy=Math.max(0,ly-sy);inner.style.transform=`translateY(${dy}px)`;if(dy>2)e.preventDefault()},{passive:false});let end=()=>{if(!drag)return;drag=false;let dy=Math.max(0,ly-sy),v=dy/Math.max(1,Date.now()-st);inner.style.transition='transform .2s';if(dy>110||v>.65){inner.style.transform='translateY(105%)';setTimeout(()=>{sheet.classList.remove('open');inner.style.transform='';inner.style.transition=''},210)}else{inner.style.transform='translateY(0)';setTimeout(()=>{inner.style.transform='';inner.style.transition=''},210)}};h.addEventListener('touchend',end);h.addEventListener('touchcancel',end)})}bindSheets();document.getElementById('addBtn').onclick=()=>addSheet.classList.add('open');document.getElementById('menuBtn').onclick=()=>menuSheet.classList.add('open');document.getElementById('removeCard').onclick=()=>{if(currentConfig){order=order.filter(x=>x!==currentConfig);save();configSheet.classList.remove('open');render()}};let theme=localStorage.getItem('bs.theme')||'dark';function applyTheme(){document.body.classList.toggle('light',theme==='light');document.getElementById('themeText').textContent=theme==='dark'?'Oscura':'Clara'}document.getElementById('themeRow').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('bs.theme',theme);applyTheme()};applyTheme();
window.BoatStation={updateGPS:o=>{state.gps=o;applyLive()},locationDenied:()=>showToast('GPS sin permiso'),updatePhone:o=>{state.phone=o;applyLive()},updateCompass:h=>{state.heading=Number(h)||0;applyLive()},updateMotion:m=>{state.motion=Number(m)||0;motionSamples.push({t:Date.now(),v:state.motion});recalcSea(false);set('[data-motion]',state.motion.toFixed(2))},onBleScanResult:o=>{scanResults[o.address]=o;renderScan()},onBatteryConnection:o=>{state.batteries[o.slot]={...state.batteries[o.slot],...o};applyLive();if(currentConfig==='batteries')refreshDiagArea()},onBatteryServices:o=>{batteryDiag[o.slot].services=o.services||[];if(currentConfig==='batteries')refreshDiagArea()},onBatteryRaw:o=>{let d=batteryDiag[o.slot];d.raw.push(o);if(d.raw.length>40)d.raw=d.raw.slice(-40);if(currentConfig==='batteries')refreshDiagArea()}};render();setTimeout(loadSavedBatteries,500);setInterval(()=>recalcSea(true),5000);
</script></body></html>
