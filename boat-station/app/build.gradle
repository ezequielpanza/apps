plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boatstation.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.boatstation.app'
        minSdk 26
        targetSdk 35
        versionCode 200
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
